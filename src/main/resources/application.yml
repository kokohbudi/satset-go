keycloak:
  realm: master
  base-server-url: http://localhost:8888
  server-url: ${keycloak.base-server-url}
  client-id: omnip-client
  client-secret: XXX
spring:
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${keycloak.client-id}
            client-secret: ${keycloak.client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${keycloak.base-server-url}/realms/${keycloak.realm}
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.base-server-url}/realms/${keycloak.realm}
  datasource:
    url: jdbc:postgresql://localhost:5432/omni_pulsa
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect