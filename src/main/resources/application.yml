spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: xxxx
            client-secret: XXX
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: http://localhost:8888/realms/master
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8888/realms/master
  datasource:
    url: jdbc:postgresql://localhost:5432/omni_pulsa
    username: admin
    password: xxxx
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


