<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- ============================================== -->
    <!-- TABLE COMPONENTS                               -->
    <!-- ============================================== -->

    <!-- Data Table Container -->
    <!-- Usage: Wrap your table with this container -->
    <div th:fragment="table-container(title, createAction)"
        class="card bg-base-100 shadow-lg border border-base-300/50">

        <!-- Table Header -->
        <div class="card-body pb-2">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <h2 th:text="${title}" class="card-title text-lg font-bold">Data Table</h2>

                <div class="flex items-center gap-3">
                    <!-- Search -->
                    <div class="form-control">
                        <label class="input input-bordered input-sm flex items-center gap-2 w-64">
                            <svg class="w-4 h-4 text-base-content/50" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                            <input type="search" placeholder="Cari..." class="grow bg-transparent outline-none" />
                        </label>
                    </div>

                    <!-- Create Button -->
                    <button th:if="${createAction}"
                        th:onclick="|document.getElementById('${createAction}').showModal()|"
                        class="btn btn-primary btn-sm gap-2 shadow-lg shadow-primary/30">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                        </svg>
                        Tambah Baru
                    </button>
                </div>
            </div>
        </div>

        <!-- Table Content Slot -->
        <div class="overflow-x-auto">
            <th:block th:replace="${tableContent}"></th:block>
        </div>

        <!-- Table Footer with Pagination -->
        <div class="card-body pt-2">
            <th:block th:replace="${pagination}"></th:block>
        </div>
    </div>

    <!-- Responsive Table -->
    <table th:fragment="data-table" class="table table-zebra">
        <thead class="bg-base-200/50">
            <th:block th:replace="${tableHeader}"></th:block>
        </thead>
        <tbody>
            <th:block th:replace="${tableBody}"></th:block>
        </tbody>
    </table>

    <!-- User Table Row -->
    <!-- Usage: <tr th:replace="~{components/tables :: user-row(user=${user})}"></tr> -->
    <tr th:fragment="user-row(user)" class="hover:bg-base-200/50 transition-colors">
        <td>
            <div class="flex items-center gap-3">
                <!-- Avatar -->
                <div class="avatar placeholder">
                    <div class="bg-gradient-to-br from-primary to-primary/70 text-primary-content rounded-full w-10">
                        <span th:text="${#strings.substring(user.name, 0, 2).toUpperCase()}"
                            class="text-sm font-bold">UN</span>
                    </div>
                </div>
                <!-- User Info -->
                <div>
                    <div class="font-bold" th:text="${user.name}">User Name</div>
                    <div class="text-sm text-base-content/60" th:text="${user.email}">email@example.com</div>
                </div>
            </div>
        </td>
        <td>
            <span th:text="${user.phone}" class="text-sm">+62xxx</span>
        </td>
        <td>
            <!-- Status Badge -->
            <span class="badge gap-1" th:classappend="${user.active} ? 'badge-success' : 'badge-ghost'">
                <span class="w-2 h-2 rounded-full"
                    th:classappend="${user.active} ? 'bg-success animate-pulse' : 'bg-base-content/30'"></span>
                <span th:text="${user.active} ? 'Aktif' : 'Nonaktif'">Status</span>
            </span>
        </td>
        <td>
            <!-- Role Badge -->
            <span class="badge badge-outline" th:text="${user.role}">Role</span>
        </td>
        <td>
            <span th:text="${#temporals.format(user.createdAt, 'dd MMM yyyy')}"
                class="text-sm text-base-content/70">Date</span>
        </td>
        <td>
            <!-- Action Buttons -->
            <div class="flex items-center gap-1">
                <button class="btn btn-ghost btn-xs btn-circle hover:bg-info/20 hover:text-info" title="Lihat Detail">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                    </svg>
                </button>
                <button class="btn btn-ghost btn-xs btn-circle hover:bg-primary/20 hover:text-primary" title="Edit">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                </button>
                <button class="btn btn-ghost btn-xs btn-circle hover:bg-error/20 hover:text-error" title="Hapus">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                </button>
            </div>
        </td>
    </tr>

    <!-- Pagination Component -->
    <div th:fragment="pagination(currentPage, totalPages, totalItems)"
        class="flex flex-col sm:flex-row items-center justify-between gap-4">
        <p class="text-sm text-base-content/60">
            Menampilkan <span class="font-medium" th:text="${(currentPage - 1) * 10 + 1}">1</span>
            - <span class="font-medium" th:text="${currentPage * 10}">10</span>
            dari <span class="font-medium" th:text="${totalItems}">100</span> data
        </p>

        <div class="join">
            <button class="join-item btn btn-sm" th:disabled="${currentPage <= 1}"
                th:onclick="|window.location.href='?page=' + ${currentPage - 1}|">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>

            <th:block th:each="page : ${#numbers.sequence(1, totalPages)}">
                <button class="join-item btn btn-sm" th:classappend="${page == currentPage} ? 'btn-primary' : ''"
                    th:onclick="|window.location.href='?page=' + ${page}|" th:text="${page}">1</button>
            </th:block>

            <button class="join-item btn btn-sm" th:disabled="${currentPage >= totalPages}"
                th:onclick="|window.location.href='?page=' + ${currentPage + 1}|">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Empty State -->
    <div th:fragment="empty-state(icon, title, message, actionText, actionModal)"
        class="flex flex-col items-center justify-center py-16 text-center">
        <div class="w-24 h-24 rounded-full bg-base-200 flex items-center justify-center mb-6">
            <!-- Users Icon -->
            <svg th:if="${icon == 'users'}" class="w-12 h-12 text-base-content/30" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z" />
            </svg>
            <!-- Groups Icon -->
            <svg th:if="${icon == 'groups'}" class="w-12 h-12 text-base-content/30" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            <!-- Default/Search Icon -->
            <svg th:if="${icon == null or icon == 'search'}" class="w-12 h-12 text-base-content/30" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        </div>
        <h3 th:text="${title}" class="text-xl font-bold text-base-content/70 mb-2">Tidak Ada Data</h3>
        <p th:text="${message}" class="text-base-content/50 mb-6 max-w-sm">Belum ada data yang tersedia.</p>
        <button th:if="${actionText}" th:onclick="|document.getElementById('${actionModal}').showModal()|"
            class="btn btn-primary gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
            <span th:text="${actionText}">Tambah Data</span>
        </button>
    </div>

    <!-- Loading Table Skeleton -->
    <div th:fragment="table-skeleton" class="space-y-4 p-4">
        <div th:each="i : ${#numbers.sequence(1, 5)}" class="flex items-center gap-4">
            <div class="skeleton w-10 h-10 rounded-full shrink-0"></div>
            <div class="flex-1 space-y-2">
                <div class="skeleton h-4 w-3/4"></div>
                <div class="skeleton h-3 w-1/2"></div>
            </div>
            <div class="skeleton h-6 w-16 rounded-full"></div>
            <div class="skeleton h-8 w-24"></div>
        </div>
    </div>

</body>

</html>
