<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- ============================================== -->
    <!-- CARD COMPONENTS                                -->
    <!-- ============================================== -->

    <!-- Basic Card -->
    <!-- Usage: <div th:replace="~{components/ui :: card(title='Card Title')}"> content </div> -->
    <div th:fragment="card(title)" class="card-standard hover:shadow-xl transition-all duration-300">
        <div class="card-body">
            <h2 th:if="${title}" th:text="${title}" class="card-title text-lg font-semibold"></h2>
            <th:block th:replace="${content}"></th:block>
        </div>
    </div>

    <!-- Stat Card -->
    <!-- Usage: <div th:replace="~{components/ui :: stat-card(title='Total Users', value='1,234', change='+12%', changeType='up', icon='users')}"></div> -->
    <div th:fragment="stat-card(title, value, change, changeType, icon)" class="stat-card group cursor-pointer">
        <div class="flex items-start justify-between">
            <div class="space-y-2">
                <p th:text="${title}" class="text-sm font-medium text-base-content/60 uppercase tracking-wide">Metric
                </p>
                <p th:text="${value}" class="text-3xl font-bold text-base-content">0</p>
                <div class="flex items-center gap-1"
                    th:classappend="${changeType == 'up'} ? 'text-success' : (${changeType == 'down'} ? 'text-error' : 'text-base-content/60')">
                    <svg th:if="${changeType == 'up'}"
                        th:replace="~{components/icons :: icon-trend-up(class='w-4 h-4')}"></svg>
                    <svg th:if="${changeType == 'down'}"
                        th:replace="~{components/icons :: icon-trend-down(class='w-4 h-4')}"></svg>
                    <span th:text="${change}" class="text-sm font-medium">0%</span>
                    <span class="text-xs text-base-content/50">vs bulan lalu</span>
                </div>
            </div>
            <div
                class="w-14 h-14 rounded-2xl bg-gradient-to-br from-primary/20 to-primary/5 flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
                <!-- Users Icon -->
                <svg th:if="${icon == 'users'}"
                    th:replace="~{components/icons :: icon-users(class='w-7 h-7 text-primary')}"></svg>
                <!-- Money Icon -->
                <svg th:if="${icon == 'money'}"
                    th:replace="~{components/icons :: icon-money(class='w-7 h-7 text-primary')}"></svg>
                <!-- Transaction Icon -->
                <svg th:if="${icon == 'transaction'}"
                    th:replace="~{components/icons :: icon-document(class='w-7 h-7 text-primary')}"></svg>
                <!-- Group Icon -->
                <svg th:if="${icon == 'group'}"
                    th:replace="~{components/icons :: icon-group(class='w-7 h-7 text-primary')}"></svg>
                <!-- Success Icon -->
                <svg th:if="${icon == 'success'}"
                    th:replace="~{components/icons :: icon-check-circle(class='w-7 h-7 text-success')}"></svg>
            </div>
        </div>
    </div>

    <!-- Info Card with Actions -->
    <!-- Usage: <div th:replace="~{components/ui :: info-card(title='Title', subtitle='Subtitle', badge='Active', badgeType='success')}"></div> -->
    <div th:fragment="info-card(title, subtitle, badge, badgeType)"
        class="card bg-base-100 shadow-sm border border-base-300/50 hover:shadow-lg hover:border-primary/30 transition-all duration-300 group">
        <div class="card-body p-4">
            <div class="flex items-center justify-between">
                <div class="flex-1 min-w-0">
                    <h3 th:text="${title}" class="font-semibold text-base-content truncate">Title</h3>
                    <p th:text="${subtitle}" class="text-sm text-base-content/60 truncate">Subtitle</p>
                </div>
                <div th:if="${badge}" class="badge"
                    th:classappend="${badgeType == 'success'} ? 'badge-success' : (${badgeType == 'warning'} ? 'badge-warning' : (${badgeType == 'error'} ? 'badge-error' : 'badge-info'))">
                    <span th:text="${badge}">Badge</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- BUTTON COMPONENTS                              -->
    <!-- ============================================== -->

    <!-- Primary Button -->
    <button th:fragment="btn-primary(text, type, size)" th:type="${type ?: 'button'}" class="btn-primary-shadow gap-2"
        th:classappend="${size == 'sm'} ? 'btn-sm' : (${size == 'lg'} ? 'btn-lg' : '')">
        <span th:text="${text}">Button</span>
    </button>

    <!-- Secondary Button -->
    <button th:fragment="btn-secondary(text, type, size)" th:type="${type ?: 'button'}"
        class="btn btn-outline btn-primary gap-2 hover:shadow-lg transition-all duration-200"
        th:classappend="${size == 'sm'} ? 'btn-sm' : (${size == 'lg'} ? 'btn-lg' : '')">
        <span th:text="${text}">Button</span>
    </button>

    <!-- Ghost Button -->
    <button th:fragment="btn-ghost(text, type)" th:type="${type ?: 'button'}"
        class="btn btn-ghost gap-2 hover:bg-base-200 transition-all duration-200">
        <span th:text="${text}">Button</span>
    </button>

    <!-- Danger Button -->
    <button th:fragment="btn-danger(text, type)" th:type="${type ?: 'button'}"
        class="btn btn-error gap-2 shadow-lg shadow-error/30 hover:shadow-xl hover:shadow-error/40 transition-all duration-200">
        <span th:text="${text}">Button</span>
    </button>

    <!-- Icon Button -->
    <button th:fragment="btn-icon(icon, tooltip)" type="button"
        class="btn btn-ghost btn-circle hover:bg-primary/10 hover:text-primary transition-all duration-200"
        th:title="${tooltip}">
        <!-- Edit Icon -->
        <svg th:if="${icon == 'edit'}" th:replace="~{components/icons :: icon-edit}"></svg>
        <!-- Delete Icon -->
        <svg th:if="${icon == 'delete'}" th:replace="~{components/icons :: icon-delete}"></svg>
        <!-- View Icon -->
        <svg th:if="${icon == 'view'}" th:replace="~{components/icons :: icon-view}"></svg>
        <!-- Add Icon -->
        <svg th:if="${icon == 'add'}" th:replace="~{components/icons :: icon-add}"></svg>
    </button>

    <!-- ============================================== -->
    <!-- ALERT/NOTIFICATION COMPONENTS                  -->
    <!-- ============================================== -->

    <!-- Alert Component -->
    <div th:fragment="alert(message, type, dismissible)" class="alert shadow-lg"
        th:classappend="${type == 'success'} ? 'alert-success' : (${type == 'error'} ? 'alert-error' : (${type == 'warning'} ? 'alert-warning' : 'alert-info'))"
        x-data="{ show: true }" x-show="show" x-transition>
        <svg th:if="${type == 'success'}" th:replace="~{components/icons :: icon-check-circle(class='w-6 h-6')}"></svg>
        <svg th:if="${type == 'error'}" th:replace="~{components/icons :: icon-error(class='w-6 h-6')}"></svg>
        <svg th:if="${type == 'warning'}" th:replace="~{components/icons :: icon-warning(class='w-6 h-6')}"></svg>
        <svg th:if="${type == 'info'}" th:replace="~{components/icons :: icon-info(class='w-6 h-6')}"></svg>
        <span th:text="${message}">Alert message</span>
        <button th:if="${dismissible}" @click="show = false" class="btn btn-ghost btn-sm btn-circle">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <!-- ============================================== -->
    <!-- BADGE COMPONENTS                               -->
    <!-- ============================================== -->

    <!-- Status Badge -->
    <span th:fragment="status-badge(status)" class="badge gap-1"
        th:classappend="${status == 'active'} ? 'badge-success' : (${status == 'inactive'} ? 'badge-ghost' : (${status == 'pending'} ? 'badge-warning' : 'badge-error'))">
        <span class="w-2 h-2 rounded-full animate-pulse"
            th:classappend="${status == 'active'} ? 'bg-success' : (${status == 'inactive'} ? 'bg-base-content/30' : (${status == 'pending'} ? 'bg-warning' : 'bg-error'))"></span>
        <span
            th:text="${status == 'active'} ? 'Aktif' : (${status == 'inactive'} ? 'Nonaktif' : (${status == 'pending'} ? 'Pending' : 'Suspended'))">Status</span>
    </span>

    <!-- Role Badge -->
    <span th:fragment="role-badge(role)" class="badge"
        th:classappend="${role == 'ADMIN'} ? 'badge-primary' : (${role == 'OPERATOR'} ? 'badge-secondary' : 'badge-ghost')">
        <span th:text="${role}">Role</span>
    </span>

    <!-- ============================================== -->
    <!-- AVATAR COMPONENTS                              -->
    <!-- ============================================== -->

    <!-- User Avatar -->
    <div th:fragment="avatar(name, size, status)" class="avatar"
        th:classappend="${status == 'online'} ? 'online' : (${status == 'offline'} ? 'offline' : '')">
        <div class="rounded-full bg-gradient-to-br from-primary to-primary/70 text-primary-content flex items-center justify-center font-bold"
            th:classappend="${size == 'sm'} ? 'w-8 text-xs' : (${size == 'lg'} ? 'w-16 text-xl' : 'w-10 text-sm')">
            <span th:text="${#strings.substring(name, 0, 2).toUpperCase()}">UN</span>
        </div>
    </div>

    <!-- Avatar with Image -->
    <div th:fragment="avatar-img(src, alt, size)" class="avatar">
        <div class="rounded-full ring ring-primary ring-offset-base-100 ring-offset-2"
            th:classappend="${size == 'sm'} ? 'w-8' : (${size == 'lg'} ? 'w-16' : 'w-10')">
            <img th:src="${src}" th:alt="${alt}" />
        </div>
    </div>

</body>

</html>
