<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- ============================================== -->
    <!-- CARD COMPONENTS                                -->
    <!-- ============================================== -->

    <!-- Basic Card -->
    <!-- Usage: <div th:replace="~{components/ui :: card(title='Card Title')}"> content </div> -->
    <div th:fragment="card(title)"
        class="card bg-base-100 shadow-lg border border-base-300/50 hover:shadow-xl transition-all duration-300">
        <div class="card-body">
            <h2 th:if="${title}" th:text="${title}" class="card-title text-lg font-semibold"></h2>
            <th:block th:replace="${content}"></th:block>
        </div>
    </div>

    <!-- Stat Card -->
    <!-- Usage: <div th:replace="~{components/ui :: stat-card(title='Total Users', value='1,234', change='+12%', changeType='up', icon='users')}"></div> -->
    <div th:fragment="stat-card(title, value, change, changeType, icon)" class="stat-card group cursor-pointer">
        <div class="flex items-start justify-between">
            <div class="space-y-2">
                <p th:text="${title}" class="text-sm font-medium text-base-content/60 uppercase tracking-wide">Metric
                </p>
                <p th:text="${value}" class="text-3xl font-bold text-base-content">0</p>
                <div class="flex items-center gap-1"
                    th:classappend="${changeType == 'up'} ? 'text-success' : (${changeType == 'down'} ? 'text-error' : 'text-base-content/60')">
                    <svg th:if="${changeType == 'up'}" class="w-4 h-4" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                    </svg>
                    <svg th:if="${changeType == 'down'}" class="w-4 h-4" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
                    </svg>
                    <span th:text="${change}" class="text-sm font-medium">0%</span>
                    <span class="text-xs text-base-content/50">vs bulan lalu</span>
                </div>
            </div>
            <div
                class="w-14 h-14 rounded-2xl bg-gradient-to-br from-primary/20 to-primary/5 flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
                <!-- Users Icon -->
                <svg th:if="${icon == 'users'}" class="w-7 h-7 text-primary" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z" />
                </svg>
                <!-- Money Icon -->
                <svg th:if="${icon == 'money'}" class="w-7 h-7 text-primary" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <!-- Transaction Icon -->
                <svg th:if="${icon == 'transaction'}" class="w-7 h-7 text-primary" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                <!-- Group Icon -->
                <svg th:if="${icon == 'group'}" class="w-7 h-7 text-primary" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <!-- Success Icon -->
                <svg th:if="${icon == 'success'}" class="w-7 h-7 text-success" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            </div>
        </div>
    </div>

    <!-- Info Card with Actions -->
    <!-- Usage: <div th:replace="~{components/ui :: info-card(title='Title', subtitle='Subtitle', badge='Active', badgeType='success')}"></div> -->
    <div th:fragment="info-card(title, subtitle, badge, badgeType)"
        class="card bg-base-100 shadow-sm border border-base-300/50 hover:shadow-lg hover:border-primary/30 transition-all duration-300 group">
        <div class="card-body p-4">
            <div class="flex items-center justify-between">
                <div class="flex-1 min-w-0">
                    <h3 th:text="${title}" class="font-semibold text-base-content truncate">Title</h3>
                    <p th:text="${subtitle}" class="text-sm text-base-content/60 truncate">Subtitle</p>
                </div>
                <div th:if="${badge}" class="badge"
                    th:classappend="${badgeType == 'success'} ? 'badge-success' : (${badgeType == 'warning'} ? 'badge-warning' : (${badgeType == 'error'} ? 'badge-error' : 'badge-info'))">
                    <span th:text="${badge}">Badge</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- BUTTON COMPONENTS                              -->
    <!-- ============================================== -->

    <!-- Primary Button -->
    <button th:fragment="btn-primary(text, type, size)" th:type="${type ?: 'button'}"
        class="btn btn-primary gap-2 shadow-lg shadow-primary/30 hover:shadow-xl hover:shadow-primary/40 transition-all duration-200"
        th:classappend="${size == 'sm'} ? 'btn-sm' : (${size == 'lg'} ? 'btn-lg' : '')">
        <span th:text="${text}">Button</span>
    </button>

    <!-- Secondary Button -->
    <button th:fragment="btn-secondary(text, type, size)" th:type="${type ?: 'button'}"
        class="btn btn-outline btn-primary gap-2 hover:shadow-lg transition-all duration-200"
        th:classappend="${size == 'sm'} ? 'btn-sm' : (${size == 'lg'} ? 'btn-lg' : '')">
        <span th:text="${text}">Button</span>
    </button>

    <!-- Ghost Button -->
    <button th:fragment="btn-ghost(text, type)" th:type="${type ?: 'button'}"
        class="btn btn-ghost gap-2 hover:bg-base-200 transition-all duration-200">
        <span th:text="${text}">Button</span>
    </button>

    <!-- Danger Button -->
    <button th:fragment="btn-danger(text, type)" th:type="${type ?: 'button'}"
        class="btn btn-error gap-2 shadow-lg shadow-error/30 hover:shadow-xl hover:shadow-error/40 transition-all duration-200">
        <span th:text="${text}">Button</span>
    </button>

    <!-- Icon Button -->
    <button th:fragment="btn-icon(icon, tooltip)" type="button"
        class="btn btn-ghost btn-circle hover:bg-primary/10 hover:text-primary transition-all duration-200"
        th:title="${tooltip}">
        <!-- Edit Icon -->
        <svg th:if="${icon == 'edit'}" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
        <!-- Delete Icon -->
        <svg th:if="${icon == 'delete'}" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        <!-- View Icon -->
        <svg th:if="${icon == 'view'}" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
        <!-- Add Icon -->
        <svg th:if="${icon == 'add'}" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
    </button>

    <!-- ============================================== -->
    <!-- ALERT/NOTIFICATION COMPONENTS                  -->
    <!-- ============================================== -->

    <!-- Alert Component -->
    <div th:fragment="alert(message, type, dismissible)" class="alert shadow-lg"
        th:classappend="${type == 'success'} ? 'alert-success' : (${type == 'error'} ? 'alert-error' : (${type == 'warning'} ? 'alert-warning' : 'alert-info'))"
        x-data="{ show: true }" x-show="show" x-transition>
        <svg th:if="${type == 'success'}" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <svg th:if="${type == 'error'}" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <svg th:if="${type == 'warning'}" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <svg th:if="${type == 'info'}" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span th:text="${message}">Alert message</span>
        <button th:if="${dismissible}" @click="show = false" class="btn btn-ghost btn-sm btn-circle">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>

    <!-- ============================================== -->
    <!-- BADGE COMPONENTS                               -->
    <!-- ============================================== -->

    <!-- Status Badge -->
    <span th:fragment="status-badge(status)" class="badge gap-1"
        th:classappend="${status == 'active'} ? 'badge-success' : (${status == 'inactive'} ? 'badge-ghost' : (${status == 'pending'} ? 'badge-warning' : 'badge-error'))">
        <span class="w-2 h-2 rounded-full animate-pulse"
            th:classappend="${status == 'active'} ? 'bg-success' : (${status == 'inactive'} ? 'bg-base-content/30' : (${status == 'pending'} ? 'bg-warning' : 'bg-error'))"></span>
        <span
            th:text="${status == 'active'} ? 'Aktif' : (${status == 'inactive'} ? 'Nonaktif' : (${status == 'pending'} ? 'Pending' : 'Suspended'))">Status</span>
    </span>

    <!-- Role Badge -->
    <span th:fragment="role-badge(role)" class="badge"
        th:classappend="${role == 'ADMIN'} ? 'badge-primary' : (${role == 'OPERATOR'} ? 'badge-secondary' : 'badge-ghost')">
        <span th:text="${role}">Role</span>
    </span>

    <!-- ============================================== -->
    <!-- AVATAR COMPONENTS                              -->
    <!-- ============================================== -->

    <!-- User Avatar -->
    <div th:fragment="avatar(name, size, status)" class="avatar"
        th:classappend="${status == 'online'} ? 'online' : (${status == 'offline'} ? 'offline' : '')">
        <div class="rounded-full bg-gradient-to-br from-primary to-primary/70 text-primary-content flex items-center justify-center font-bold"
            th:classappend="${size == 'sm'} ? 'w-8 text-xs' : (${size == 'lg'} ? 'w-16 text-xl' : 'w-10 text-sm')">
            <span th:text="${#strings.substring(name, 0, 2).toUpperCase()}">UN</span>
        </div>
    </div>

    <!-- Avatar with Image -->
    <div th:fragment="avatar-img(src, alt, size)" class="avatar">
        <div class="rounded-full ring ring-primary ring-offset-base-100 ring-offset-2"
            th:classappend="${size == 'sm'} ? 'w-8' : (${size == 'lg'} ? 'w-16' : 'w-10')">
            <img th:src="${src}" th:alt="${alt}" />
        </div>
    </div>

</body>

</html>
