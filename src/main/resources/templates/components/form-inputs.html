<!--
    Floating Label Input Component
    Usage: 
    <div th:replace="~{components/form-inputs :: floating-input(
        name='username',
        label='Username', 
        type='text',
        required=true,
        xModel='form.username',
        xError='errors.username'
    )}"></div>
    
    For password with toggle:
    <div th:replace="~{components/form-inputs :: floating-password(
        name='password',
        label='Password', 
        required=true,
        xModel='form.password',
        xError='errors.password',
        xShowPassword='showPassword'
    )}"></div>
-->

<!-- Floating Text Input -->
<div th:fragment="floating-input(name, label, type, required, xModel, xError)" class="floating-input-wrapper">
    <div class="relative">
        <input th:type="${type ?: 'text'}" th:id="${name}" th:name="${name}"
            th:attr="x-model=${xModel}, @input=validateField('${name}')" class="floating-input peer"
            :class="{'input-error': [[${xError}]]}" placeholder=" " th:required="${required}" />
        <label th:for="${name}" class="floating-label">
            <span th:text="${label}"></span>
            <span th:if="${required}" class="text-error ml-0.5">*</span>
        </label>
    </div>
    <div class="label" th:attr="x-show=${xError}">
        <span class="label-text-alt text-error" th:attr="x-text=${xError}"></span>
    </div>
</div>

<!-- Floating Password Input with Toggle -->
<div th:fragment="floating-password(name, label, required, xModel, xError, xShowPassword)"
    class="floating-input-wrapper">
    <div class="relative">
        <input th:id="${name}" th:name="${name}" th:attr="x-model=${xModel}, @input=validateField('${name}')"
            :type="[[${xShowPassword}]] ? 'text' : 'password'" class="floating-input peer pr-10"
            :class="{'input-error': [[${xError}]]}" placeholder=" " th:required="${required}" />
        <label th:for="${name}" class="floating-label">
            <span th:text="${label}"></span>
            <span th:if="${required}" class="text-error ml-0.5">*</span>
        </label>
        <!-- Password Toggle Button -->
        <button type="button" th:attr="@click=${xShowPassword} + ' = !' + ${xShowPassword}"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-base-content/50 hover:text-base-content z-10">
            <svg th:attr="x-show='!' + ${xShowPassword}" class="w-5 h-5" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
            <svg th:attr="x-show=${xShowPassword}" class="w-5 h-5" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
        </button>
    </div>
    <div class="label" th:attr="x-show=${xError}">
        <span class="label-text-alt text-error" th:attr="x-text=${xError}"></span>
    </div>
</div>

<!-- Floating Textarea -->
<div th:fragment="floating-textarea(name, label, required, xModel, xError, rows)" class="floating-input-wrapper">
    <div class="relative">
        <textarea th:id="${name}" th:name="${name}" th:attr="x-model=${xModel}, @input=validateField('${name}')"
            th:rows="${rows ?: 3}" class="floating-input floating-textarea peer" :class="{'input-error': [[${xError}]]}"
            placeholder=" " th:required="${required}"></textarea>
        <label th:for="${name}" class="floating-label floating-label-textarea">
            <span th:text="${label}"></span>
            <span th:if="${required}" class="text-error ml-0.5">*</span>
        </label>
    </div>
    <div class="label" th:attr="x-show=${xError}">
        <span class="label-text-alt text-error" th:attr="x-text=${xError}"></span>
    </div>
</div>

<!-- Floating Select -->
<div th:fragment="floating-select(name, label, required, xModel, xError)" class="floating-input-wrapper">
    <div class="relative">
        <select th:id="${name}" th:name="${name}" th:attr="x-model=${xModel}, @change=validateField('${name}')"
            class="floating-input floating-select peer" :class="{'input-error': [[${xError}]]}"
            th:required="${required}">
            <option value="" disabled selected></option>
            <th:block th:replace="${selection}" />
        </select>
        <label th:for="${name}" class="floating-label floating-label-select">
            <span th:text="${label}"></span>
            <span th:if="${required}" class="text-error ml-0.5">*</span>
        </label>
    </div>
    <div class="label" th:attr="x-show=${xError}">
        <span class="label-text-alt text-error" th:attr="x-text=${xError}"></span>
    </div>
</div>
