<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head th:replace="pages/fragments/htmlHead :: htmlHead">
<body class="bg-gray-100 flex flex-col md:flex-row min-h-screen">
<style>
    input[type="checkbox"] {
        accent-color: #ea580c !important;
    }
</style>
<!-- Sidebar -->
<th:block th:replace="~{pages/fragments/sidebar :: sidebar}"></th:block>

<!-- Konten Utama -->
<div class="main-content-area">
    <!-- Header -->
    <th:block th:replace="~{pages/fragments/header :: header}"></th:block>

    <!-- Area Konten Utama -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="mb-8">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900" th:text="${pageTitle}">Assign Role ke User</h1>
                    <p class="mt-2 text-gray-600">Kelola assignment role ke user untuk mengatur akses mereka ke fitur aplikasi</p>
                </div>
                <div class="flex space-x-3">
                    <a href="/admin/roles" 
                       class="inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                        Kembali ke Role Management
                    </a>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- User Search & Selection -->
            <div class="bg-white rounded-2xl shadow-md border border-gray-200">
                <div class="p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Pilih User</h2>
                    
                    <!-- Search User -->
                    <div class="mb-4">
                        <label for="userSearch" class="block text-sm font-medium text-gray-700 mb-2">Cari User</label>
                        <div class="relative">
                            <input type="text" 
                                   id="userSearch" 
                                   placeholder="Masukkan email atau nama user..."
                                   class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- User List -->
                    <div id="userList" class="space-y-2 max-h-96 overflow-y-auto">
                        <!-- Users will be loaded here via JavaScript -->
                        <div class="text-center py-8 text-gray-500">
                            <svg class="mx-auto h-12 w-12 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                            <p class="mt-2">Ketik untuk mencari user</p>
                        </div>
                    </div>

                    <!-- Selected User Info -->
                    <div id="selectedUserInfo" class="hidden mt-4 p-4 bg-blue-50 border border-blue-200 rounded-lg">
                        <h3 class="font-medium text-blue-900">User Terpilih:</h3>
                        <div id="selectedUserDetails" class="mt-2 text-sm text-blue-700">
                            <!-- Selected user details will be shown here -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Role Selection & Assignment -->
            <div class="bg-white rounded-2xl shadow-md border border-gray-200">
                <div class="p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">Pilih Role</h2>
                    
                    <!-- Available Roles -->
                    <div class="space-y-3 mb-6">
                        <div th:each="role : ${roles}" class="flex items-center p-3 border rounded-lg hover:bg-gray-50">
                            <input type="checkbox" 
                                   th:id="'role_' + ${role.id}" 
                                   th:value="${role.id}" 
                                   class="h-4 w-4 accent-orange-600 focus:ring-orange-500 border-gray-300 rounded" role-checkbox>
                            <label th:for="'role_' + ${role.id}" class="ml-3 flex-1 cursor-pointer">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <span class="font-medium text-gray-900" th:text="${role.roleName}">Role Name</span>
                                        <p class="text-sm text-gray-500" th:text="${role.description}">Role description</p>
                                    </div>
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-orange-100 text-orange-800" 
                                          th:text="${role.roleCode}">role-code</span>
                                </div>
                            </label>
                        </div>
                    </div>

                    <!-- Assignment Notes -->
                    <div class="mb-6">
                        <label for="assignmentNotes" class="block text-sm font-medium text-gray-700 mb-2">Catatan Assignment (Opsional)</label>
                        <textarea id="assignmentNotes" 
                                  rows="3" 
                                  placeholder="Tambahkan catatan untuk assignment ini..."
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500"></textarea>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex space-x-3">
                        <button id="assignRoleBtn" 
                                onclick="assignRoles()" 
                                disabled
                                class="flex-1 inline-flex justify-center items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-orange-600 hover:bg-orange-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 disabled:bg-gray-300 disabled:cursor-not-allowed">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                            </svg>
                            Assign Role
                        </button>
                        <button onclick="clearSelection()" 
                                class="px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500">
                            Reset
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Current User Roles -->
        <div id="currentUserRoles" class="hidden mt-8 bg-white rounded-2xl shadow-md border border-gray-200">
            <div class="p-6">
                <h2 class="text-lg font-semibold text-gray-900 mb-4">Role Saat Ini</h2>
                <div id="currentRolesList" class="space-y-2">
                    <!-- Current roles will be loaded here -->
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white p-6 rounded-lg shadow-lg">
        <div class="flex items-center">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-gray-700">Memproses...</span>
        </div>
    </div>
</div>

<!-- Success/Error Messages -->
<div id="messageContainer" class="fixed top-4 right-4 z-50"></div>

<!-- JavaScript -->
<script>
    let selectedUser = null;
    let searchTimeout = null;

    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
        setupEventListeners();
    });

    // Setup event listeners
    function setupEventListeners() {
        // User search
        document.getElementById('userSearch').addEventListener('input', function(e) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                searchUsers(e.target.value);
            }, 300);
        });

        // Role checkboxes
        document.querySelectorAll('.role-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', updateAssignButton);
        });
    }

    // Search users
    async function searchUsers(query) {
        if (query.length < 2) {
            document.getElementById('userList').innerHTML = `
                <div class="text-center py-8 text-gray-500">
                    <svg class="mx-auto h-12 w-12 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <p class="mt-2">Ketik minimal 2 karakter untuk mencari user</p>
                </div>
            `;
            return;
        }

        try {
            const response = await fetch(`/admin/roles/api/users/search?query=${encodeURIComponent(query)}`);
            if (response.ok) {
                const users = await response.json();
                renderUserList(users);
            } else {
                console.error('Failed to search users');
                showMessage('Gagal mencari user', 'error');
            }
        } catch (error) {
            console.error('Error searching users:', error);
            showMessage('Terjadi kesalahan saat mencari user', 'error');
        }
    }

    // Render user list
    function renderUserList(users) {
        const container = document.getElementById('userList');
        
        if (users.length === 0) {
            container.innerHTML = `
                <div class="text-center py-8 text-gray-500">
                    <svg class="mx-auto h-12 w-12 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <p class="mt-2">Tidak ada user yang ditemukan</p>
                </div>
            `;
            return;
        }

        container.innerHTML = users.map(user => `
            <div class="flex items-center p-3 border rounded-lg hover:bg-gray-50 cursor-pointer user-item" 
                 onclick="selectUser('${user.id}', '${user.email}', '${user.fullname}', '${user.username}')">
                <div class="flex-shrink-0">
                    <div class="h-10 w-10 rounded-full bg-blue-500 flex items-center justify-center">
                        <span class="text-white font-medium text-sm">${user.fullname.charAt(0).toUpperCase()}</span>
                    </div>
                </div>
                <div class="ml-3 flex-1">
                    <p class="text-sm font-medium text-gray-900">${user.fullname}</p>
                    <p class="text-sm text-gray-500">${user.email}</p>
                    <p class="text-xs text-gray-400">@${user.username}</p>
                </div>
            </div>
        `).join('');
    }

    // Select user
    function selectUser(id, email, fullname, username) {
        selectedUser = { id, email, fullname, username };
        
        // Update selected user info
        document.getElementById('selectedUserDetails').innerHTML = `
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <div class="h-8 w-8 rounded-full bg-blue-500 flex items-center justify-center">
                        <span class="text-white font-medium text-xs">${fullname.charAt(0).toUpperCase()}</span>
                    </div>
                </div>
                <div class="ml-3">
                    <p class="font-medium">${fullname}</p>
                    <p class="text-sm">${email}</p>
                </div>
            </div>
        `;
        
        document.getElementById('selectedUserInfo').classList.remove('hidden');
        
        // Load current user roles
        loadCurrentUserRoles(id);
        
        // Update assign button state
        updateAssignButton();
    }

    // Load current user roles
    async function loadCurrentUserRoles(userId) {
        try {
            const response = await fetch(`/admin/roles/api/users/${userId}/roles`);
            if (response.ok) {
                const currentRoles = await response.json();
                
                if (currentRoles.length > 0) {
                    document.getElementById('currentRolesList').innerHTML = currentRoles.map(role => `
                        <div class="flex items-center justify-between p-3 border rounded-lg">
                            <div>
                                <span class="font-medium text-gray-900">${role.roleName}</span>
                                <span class="ml-2 inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                    ${role.roleCode}
                                </span>
                            </div>
                            <button onclick="unassignRole('${userId}', '${role.id}')" 
                                    class="text-red-600 hover:text-red-800 text-sm">
                                Hapus
                            </button>
                        </div>
                    `).join('');
                    
                    document.getElementById('currentUserRoles').classList.remove('hidden');
                } else {
                    document.getElementById('currentUserRoles').classList.add('hidden');
                }
            } else {
                console.error('Failed to load current user roles');
            }
        } catch (error) {
            console.error('Error loading current user roles:', error);
        }
    }

    // Update assign button state
    function updateAssignButton() {
        const selectedRoles = document.querySelectorAll('.role-checkbox:checked');
        const assignBtn = document.getElementById('assignRoleBtn');
        
        assignBtn.disabled = !selectedUser || selectedRoles.length === 0;
    }

    // Assign roles
    async function assignRoles() {
        if (!selectedUser) {
            showMessage('Pilih user terlebih dahulu', 'error');
            return;
        }

        const selectedRoles = Array.from(document.querySelectorAll('.role-checkbox:checked'))
            .map(checkbox => checkbox.value);

        if (selectedRoles.length === 0) {
            showMessage('Pilih minimal satu role', 'error');
            return;
        }

        const notes = document.getElementById('assignmentNotes').value;

        try {
            showLoading();
            
            const response = await fetch('/admin/roles/api/assign', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    userId: selectedUser.id,
                    roleIds: selectedRoles,
                    notes: notes
                })
            });

            if (response.ok) {
                const result = await response.json();
                showMessage(result.message || 'Role berhasil di-assign', 'success');
                
                // Reload current user roles
                loadCurrentUserRoles(selectedUser.id);
                
                // Clear role selection
                document.querySelectorAll('.role-checkbox').forEach(checkbox => {
                    checkbox.checked = false;
                });
                
                // Clear notes
                document.getElementById('assignmentNotes').value = '';
                
                updateAssignButton();
            } else {
                const error = await response.json();
                showMessage(error.message || 'Gagal assign role', 'error');
            }
        } catch (error) {
            console.error('Error assigning roles:', error);
            showMessage('Terjadi kesalahan saat assign role', 'error');
        } finally {
            hideLoading();
        }
    }

    // Unassign role
    async function unassignRole(userId, roleId) {
        if (!confirm('Apakah Anda yakin ingin menghapus role ini dari user?')) {
            return;
        }

        try {
            showLoading();
            
            const response = await fetch(`/admin/roles/api/assign/${userId}/${roleId}`, {
                method: 'DELETE'
            });

            if (response.ok) {
                const result = await response.json();
                showMessage(result.message || 'Role berhasil dihapus', 'success');
                loadCurrentUserRoles(userId);
            } else {
                const error = await response.json();
                showMessage(error.message || 'Gagal menghapus role', 'error');
            }
        } catch (error) {
            console.error('Error unassigning role:', error);
            showMessage('Terjadi kesalahan saat menghapus role', 'error');
        } finally {
            hideLoading();
        }
    }

    // Clear selection
    function clearSelection() {
        selectedUser = null;
        document.getElementById('selectedUserInfo').classList.add('hidden');
        document.getElementById('currentUserRoles').classList.add('hidden');
        document.getElementById('userSearch').value = '';
        document.getElementById('assignmentNotes').value = '';
        
        document.querySelectorAll('.role-checkbox').forEach(checkbox => {
            checkbox.checked = false;
        });
        
        document.getElementById('userList').innerHTML = `
            <div class="text-center py-8 text-gray-500">
                <svg class="mx-auto h-12 w-12 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <p class="mt-2">Ketik untuk mencari user</p>
            </div>
        `;
        
        updateAssignButton();
    }

    // Show loading overlay
    function showLoading() {
        document.getElementById('loadingOverlay').classList.remove('hidden');
    }

    // Hide loading overlay
    function hideLoading() {
        document.getElementById('loadingOverlay').classList.add('hidden');
    }

    // Show message
    function showMessage(message, type = 'info') {
        const container = document.getElementById('messageContainer');
        const messageId = 'message_' + Date.now();
        
        const bgColor = type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500';
        
        const messageElement = document.createElement('div');
        messageElement.id = messageId;
        messageElement.className = `${bgColor} text-white px-6 py-3 rounded-lg shadow-lg mb-2 transform transition-all duration-300 translate-x-full`;
        messageElement.innerHTML = `
            <div class="flex items-center justify-between">
                <span>${message}</span>
                <button onclick="removeMessage('${messageId}')" class="ml-4 text-white hover:text-gray-200">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
        `;
        
        container.appendChild(messageElement);
        
        // Animate in
        setTimeout(() => {
            messageElement.classList.remove('translate-x-full');
        }, 100);
        
        // Auto remove after 5 seconds
        setTimeout(() => {
            removeMessage(messageId);
        }, 5000);
    }

    // Remove message
    function removeMessage(messageId) {
        const element = document.getElementById(messageId);
        if (element) {
            element.classList.add('translate-x-full');
            setTimeout(() => {
                element.remove();
            }, 300);
        }
    }
</script>

</body>
</html>
