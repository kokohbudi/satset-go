<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head>
    <title th:text="${pageTitle} ?: 'Role Detail'">Role Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="checkbox"] {
            accent-color: #ea580c !important;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="mb-8">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900" th:text="${pageTitle}">Role Detail</h1>
                    <p class="mt-2 text-gray-600">Kelola menu yang terkait dengan role ini</p>
                </div>
                <div class="flex space-x-3">

                </div>
            </div>
        </div>

        <!-- Role Info Card -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-900 mb-4">Informasi Role</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nama Role</label>
                    <p class="mt-1 text-lg font-medium text-gray-900" th:text="${role.roleName}">Role Name</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Status</label>
                    <span th:if="${role.active}" class="inline-flex px-2 py-1 text-xs font-medium bg-green-100 text-green-800 rounded-full">Aktif</span>
                    <span th:if="${!role.active}" class="inline-flex px-2 py-1 text-xs font-medium bg-red-100 text-red-800 rounded-full">Tidak Aktif</span>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700">Deskripsi</label>
                    <p class="mt-1 text-gray-600" th:text="${role.description} ?: 'Tidak ada deskripsi'">Description</p>
                </div>
            </div>
        </div>

        <!-- Menu Assignment Form -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-semibold text-gray-900">Menu Assignment</h2>
                <button type="button" onclick="updateRoleMenus()" class="bg-orange-600 hover:bg-orange-700 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                    Simpan Perubahan
                </button>
            </div>

            <form id="menuForm" onsubmit="return false;">
                <div class="space-y-4">
                    <div th:each="menu : ${allMenus}" class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg">
                        <input type="checkbox"
                               th:id="'menu-' + ${menu.id}"
                               th:value="${menu.id}"
                               th:checked="${role.menus != null and #lists.contains(role.menus.![id], menu.id)}"
                               class="h-4 w-4 accent-orange-600 focus:ring-orange-500 border-gray-300 rounded">
                        <div class="flex-1">
                            <label th:for="'menu-' + ${menu.id}" class="text-sm font-medium text-gray-900 cursor-pointer" th:text="${menu.menuName}">Menu Name</label>
                            <p class="text-xs text-gray-500" th:text="${menu.description} ?: ''"></p>
                        </div>
                        <span th:if="${menu.parentMenuId != null}" th:text="'Sub-menu dari: ' + ${menu.parentMenuName}"></span>
                    </div>
                </div>
            </form>

            <div id="message" class="mt-6 hidden">
                <div class="p-4 rounded-lg">
                    <p class="text-sm" id="messageText"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateRoleMenus() {
            const form = document.getElementById('menuForm');
            const checkboxes = form.querySelectorAll('input[type="checkbox"]:checked');
            const menuIds = Array.from(checkboxes).map(cb => cb.value);

            const roleId = /*[[${role.id}]]*/ '';
            const url = `/dashboard/admin/roles/api/${roleId}/menus`;

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRF-TOKEN': document.querySelector('meta[name="_csrf"]')?.getAttribute('content') || ''
                },
                body: JSON.stringify(menuIds)
            })
            .then(response => response.json())
            .then(data => {
                const messageDiv = document.getElementById('message');
                const messageText = document.getElementById('messageText');
                messageDiv.classList.remove('hidden');

                if (data.status === 'success') {
                    messageDiv.classList.add('bg-green-50', 'border', 'border-green-200');
                    messageText.classList.add('text-green-800');
                    messageText.textContent = data.message || 'Menu berhasil diperbarui';
                } else {
                    messageDiv.classList.add('bg-red-50', 'border', 'border-red-200');
                    messageText.classList.add('text-red-800');
                    messageText.textContent = data.message || 'Gagal memperbarui menu';
                }

                // Hide message after 5 seconds
                setTimeout(() => {
                    messageDiv.classList.add('hidden');
                    messageDiv.classList.remove('bg-green-50', 'border-green-200', 'bg-red-50', 'border-red-200');
                    messageText.classList.remove('text-green-800', 'text-red-800');
                }, 5000);
            })
            .catch(error => {
                console.error('Error:', error);
                const messageDiv = document.getElementById('message');
                const messageText = document.getElementById('messageText');
                messageDiv.classList.remove('hidden');
                messageDiv.classList.add('bg-red-50', 'border', 'border-red-200');
                messageText.classList.add('text-red-800');
                messageText.textContent = 'Terjadi kesalahan saat memperbarui menu';
            });
        }
    </script>
</div>
</body>
</html>
