<!DOCTYPE html>
<html layout:decorate="~{layouts/base}" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <title>Tambah Reseller</title>
</head>

<body>
    <div layout:fragment="content">

        <!-- Page Header -->
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-base-content mb-2">Tambah Reseller Baru</h1>
            <p class="text-base-content/60">Buat akun reseller baru beserta organisasi toko-nya. User akan menerima
                email untuk set password.</p>
        </div>

        <!-- Form Card -->
        <div class="max-w-2xl">
            <div class="card bg-base-100 shadow-lg border border-base-300/50">
                <div class="card-body" x-data="resellerForm()">
                    <form @submit.prevent="submitForm">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <!-- Username -->
                            <div class="form-control">
                                <label class="label">
                                    <span class="label-text font-medium">Username *</span>
                                </label>
                                <input type="text" x-model="form.username" placeholder="cth: tokojaya"
                                    class="input input-bordered focus:input-primary w-full" required />
                            </div>

                            <!-- Email -->
                            <div class="form-control">
                                <label class="label">
                                    <span class="label-text font-medium">Email *</span>
                                </label>
                                <input type="email" x-model="form.email" placeholder="cth: owner@tokojaya.com"
                                    class="input input-bordered focus:input-primary w-full" required />
                            </div>

                            <!-- Nama Toko / Org Name -->
                            <div class="form-control">
                                <label class="label">
                                    <span class="label-text font-medium">Nama Toko *</span>
                                </label>
                                <input type="text" x-model="form.orgName" placeholder="cth: Toko Jaya Abadi"
                                    class="input input-bordered focus:input-primary w-full" required />
                            </div>

                            <!-- Phone -->
                            <div class="form-control">
                                <label class="label">
                                    <span class="label-text font-medium">No. Handphone *</span>
                                </label>
                                <input type="tel" x-model="form.phone" placeholder="cth: 081234567890"
                                    class="input input-bordered focus:input-primary w-full" required />
                            </div>

                            <!-- Role (Optional) -->
                            <div class="form-control">
                                <label class="label">
                                    <span class="label-text font-medium">Role</span>
                                    <span class="label-text-alt text-base-content/50">Opsional</span>
                                </label>
                                <select x-model="form.role" class="select select-bordered focus:select-primary w-full">
                                    <option value="">-- Pilih Role --</option>
                                    <th:block th:each="role : ${availableRoles}">
                                        <option th:value="${role.name}" th:text="${role.name}"></option>
                                    </th:block>
                                </select>
                            </div>

                            <!-- Upline (Optional) -->
                            <div class="form-control">
                                <label class="label">
                                    <span class="label-text font-medium">Upline Store ID</span>
                                    <span class="label-text-alt text-base-content/50">Opsional</span>
                                </label>
                                <input type="text" x-model="form.upline" placeholder="UUID dari store upline (jika ada)"
                                    class="input input-bordered focus:input-primary w-full" />
                            </div>
                        </div>

                        <!-- Submit -->
                        <div class="form-control mt-6">
                            <button type="submit" class="btn btn-primary shadow-sm hover:shadow-md transition-shadow"
                                :disabled="loading" :class="{ 'loading': loading }">
                                <span x-show="!loading">Buat Reseller</span>
                                <span x-show="loading">Memproses...</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <div layout:fragment="scripts">
        <script>
            function resellerForm() {
                return {
                    loading: false,
                    form: {
                        username: '',
                        email: '',
                        orgName: '',
                        phone: '',
                        role: '',
                        upline: ''
                    },
                    async submitForm() {
                        this.loading = true;

                        try {
                            const params = new URLSearchParams();
                            params.append('username', this.form.username);
                            params.append('email', this.form.email);
                            params.append('orgName', this.form.orgName);
                            params.append('phone', this.form.phone);
                            if (this.form.role) params.append('role', this.form.role);
                            if (this.form.upline) params.append('upline', this.form.upline);

                            const response = await fetch('/api/admin/resellers', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                                body: params.toString()
                            });

                            const data = await response.json();

                            if (response.ok && data.status === 'success') {
                                Alpine.store('toast').success(data.message || 'Reseller berhasil dibuat');
                                this.form = { username: '', email: '', orgName: '', phone: '', role: '', upline: '' };
                            } else {
                                Alpine.store('toast').error(data.message || 'Gagal membuat reseller');
                            }
                        } catch (err) {
                            Alpine.store('toast').error('Terjadi kesalahan koneksi');
                        } finally {
                            this.loading = false;
                        }
                    }
                }
            }
        </script>
    </div>
</body>

</html>
