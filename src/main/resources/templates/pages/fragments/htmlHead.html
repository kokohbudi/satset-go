<head th:fragment="htmlHead">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin Pulsa</title>
    <!-- Tautan ke file CSS yang di-build oleh Tailwind -->
    <link href="/css/offounder.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Button Color Variables - Global */
            --btn-primary-bg: #ff8c00;
            --btn-primary-hover: #e67e00;
            --btn-primary-focus: rgba(255, 140, 0, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc;
        }

        .optimist-orange-gradient {
            background-image: linear-gradient(to right, #ff9933, #ffcc66);
        }

        .optimist-orange-text {
            color: #ff8c00;
        }

        .optimist-orange-bg {
            background-color: #ff8c00;
        }

        .sidebar {
            transition: transform 0.3s ease-in-out;
            transform: translateX(-100%);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        @media (min-width: 768px) {
            .sidebar {
                transform: translateX(0);
            }
        }
        input[type="checkbox"] {
            accent-color: var(--btn-primary-bg) !important;
        }
    </style>
