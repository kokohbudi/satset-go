<th:block th:fragment="sidebar">
    <div
            id="sidebar"
            class="sidebar fixed inset-y-0 left-0 z-50 w-64 bg-white shadow-xl flex flex-col p-4 md:relative md:translate-x-0"
    >
        <!-- Logo dan Nama Aplikasi -->
        <div class="flex items-center justify-between mb-8 px-2">
            <div class="flex items-center">
                    <span class="text-3xl font-bold optimist-orange-text"
                    >Omni</span
                    >
                <span class="text-3xl font-light text-gray-800 ml-2"
                >Pulsa</span
                >
            </div>
            <button
                    id="closeSidebarBtn"
                    class="md:hidden text-gray-600 hover:text-gray-900 focus:outline-none"
            >
                <svg
                        class="h-6 w-6"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M6 18L18 6M6 6l12 12"
                    ></path>
                </svg>
            </button>
        </div>

        <!-- Menu Navigasi -->
        <nav class="flex-1">
            <ul class="space-y-2">
                <!-- Dashboard - Always visible for authenticated users -->
                <li>
                    <a
                            href="/dashboard"
                            class="flex items-center space-x-3 p-3 rounded-xl optimist-orange-bg text-white shadow-md hover:bg-opacity-90 transition duration-200"
                    >
                        <svg
                                class="h-6 w-6"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
                            ></path>
                        </svg>
                        <span>Dashboard</span>
                    </a>
                </li>
                
                <!-- Transaction Management - Visible for all roles -->
                <li th:if="${@menuUtils.hasMenuAccess(#authentication, 'TRANSACTION_MANAGEMENT')}">
                    <a
                            href="/transactions"
                            class="flex items-center space-x-3 p-3 text-gray-600 hover:bg-gray-200 rounded-xl transition duration-200"
                    >
                        <svg
                                class="h-6 w-6"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002-2v-2a2 2 0 00-2-2h-2a2 2 0 00-2 2v2a2 2 0 002 2zm7-2v6m0-6a2 2 0 012-2h2a2 2 0 012 2v6m0 0a2 2 0 01-2 2h-2a2 2 0 01-2-2z"
                            ></path>
                        </svg>
                        <span>Transaksi</span>
                    </a>
                </li>
                
                <!-- Voucher Management -->
                <li th:if="${@menuUtils.hasMenuAccess(#authentication, 'VOUCHER_MANAGEMENT')}">
                    <a
                            href="/vouchers"
                            class="flex items-center space-x-3 p-3 text-gray-600 hover:bg-gray-200 rounded-xl transition duration-200"
                    >
                        <svg
                                class="h-6 w-6"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"
                            ></path>
                        </svg>
                        <span>Voucher</span>
                    </a>
                </li>
                
                <!-- Price Management -->
                <li th:if="${@menuUtils.hasMenuAccess(#authentication, 'PRICE_MANAGEMENT')}">
                    <a
                            href="/prices"
                            class="flex items-center space-x-3 p-3 text-gray-600 hover:bg-gray-200 rounded-xl transition duration-200"
                    >
                        <svg
                                class="h-6 w-6"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M12 8c1.657 0 3 1.343 3 3s-1.343 3-3 3-3-1.343-3-3 1.343-3 3-3z"
                            ></path>
                            <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M12 1v6m0 6v6"
                            ></path>
                        </svg>
                        <span>Harga</span>
                    </a>
                </li>
                
                <!-- Customer Management -->
                <li th:if="${@menuUtils.hasMenuAccess(#authentication, 'CUSTOMER_MANAGEMENT')}">
                    <a
                            href="/customers"
                            class="flex items-center space-x-3 p-3 text-gray-600 hover:bg-gray-200 rounded-xl transition duration-200"
                    >
                        <svg
                                class="h-6 w-6"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"
                            ></path>
                        </svg>
                        <span>Pelanggan</span>
                    </a>
                </li>
                
                <!-- User Management - Only for admin and store-admin -->
                <li th:if="${@menuUtils.hasMenuAccess(#authentication, 'USER_MANAGEMENT')}">
                    <a
                            href="/users"
                            class="flex items-center space-x-3 p-3 text-gray-600 hover:bg-gray-200 rounded-xl transition duration-200"
                    >
                        <svg
                                class="h-6 w-6"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"
                            ></path>
                        </svg>
                        <span>Pengguna</span>
                    </a>
                </li>
                
                <!-- Role Management - Only for omnip-admin and omnip-store-admin -->
                <li th:if="${@menuUtils.hasMenuAccess(#authentication, 'ROLE_MANAGEMENT')}">
                    <a
                            href="/admin/roles"
                            class="flex items-center space-x-3 p-3 text-gray-600 hover:bg-gray-200 rounded-xl transition duration-200"
                    >
                        <svg
                                class="h-6 w-6"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
                            ></path>
                        </svg>
                        <span>Manajemen Role</span>
                    </a>
                </li>
                
                <!-- Settings - Visible for admin roles -->
                <li th:if="${@menuUtils.isAdmin(#authentication)}">
                    <a
                            href="/settings"
                            class="flex items-center space-x-3 p-3 text-gray-600 hover:bg-gray-200 rounded-xl transition duration-200"
                    >
                        <svg
                                class="h-6 w-6"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                            ></path>
                            <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                            ></path>
                        </svg>
                        <span>Pengaturan</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Tombol Logout -->
        <div class="mt-8">
            <a
                    href="/logout"
                    class="flex items-center space-x-3 p-3 text-red-500 hover:bg-red-100 rounded-xl transition duration-200"
            >
                <svg
                        class="h-6 w-6"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                    ></path>
                </svg>
                <span>Keluar</span>
            </a>
        </div>
    </div>
</th:block>
