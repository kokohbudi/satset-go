<th:block th:fragment="header">
    <header
            class="bg-white shadow-md p-4 flex items-center justify-between md:sticky md:top-0 md:z-40"
    >
        <button
                id="openSidebarBtn"
                class="md:hidden text-gray-600 hover:text-gray-900 focus:outline-none"
        >
            <svg
                    class="h-6 w-6"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
            >
                <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M4 6h16M4 12h16M4 18h16"
                ></path>
            </svg>
        </button>
        <h1 class="text-2xl font-semibold text-gray-800">Dashboard</h1>

        <div class="flex items-center space-x-4">
            <div class="relative">
                <button
                        class="p-2 text-gray-600 hover:text-gray-900 rounded-full bg-gray-100 focus:outline-none focus:ring-2 focus:ring-optimist-orange-bg"
                >
                    <svg
                            class="h-6 w-6"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 5.659 6 7.667 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0a2 2 0 100 4m-4 0a2 2 0 100-4m-4 0a2 2 0 100-4m4 4a2 2 0 100-4"
                        ></path>
                    </svg>
                </button>
            </div>
            <div class="flex items-center space-x-2">
                <img
                        src="https://placehold.co/40x40/FF8C00/ffffff?text=U"
                        alt="Avatar"
                        class="h-10 w-10 rounded-full object-cover border-2 border-optimist-orange-bg"
                />
                <div class="hidden md:block">
                    <p th:text="${user.username}"></p>
                    <p class="text-xs text-gray-500" th:each="role : ${user.roles}" th:text="${role}"></p>
                </div>
            </div>
        </
        >
    </header>
</th:block>
