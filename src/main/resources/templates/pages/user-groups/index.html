<!DOCTYPE html>
<html layout:decorate="~{layouts/base}" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <title>Assign User ke Group</title>
</head>

<body>
    <div layout:fragment="content">

        <!-- Page Header -->
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-base-content mb-2">Assign User ke Group</h1>
            <p class="text-base-content/60">Atur keanggotaan user dalam group</p>
        </div>

        <!-- Main Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <!-- Available Users -->
            <div class="card bg-base-100 shadow-lg border border-base-300/50">
                <div class="card-body">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="card-title text-lg">User Tersedia</h2>
                        <span class="badge badge-ghost">12 user</span>
                    </div>

                    <div class="form-control mb-4">
                        <label class="input input-bordered input-sm flex items-center gap-2">
                            <svg class="w-4 h-4 text-base-content/50" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                            <input type="search" placeholder="Cari user..." class="grow bg-transparent outline-none" />
                        </label>
                    </div>

                    <div class="space-y-2 max-h-96 overflow-y-auto">
                        <!-- Sample User -->
                        <div
                            class="flex items-center justify-between p-3 rounded-xl bg-base-200/50 hover:bg-base-200 transition-colors cursor-pointer">
                            <div class="flex items-center gap-3">
                                <div class="avatar placeholder">
                                    <div
                                        class="bg-gradient-to-br from-primary to-primary/70 text-primary-content rounded-full w-10">
                                        <span class="text-sm font-bold">JD</span>
                                    </div>
                                </div>
                                <div>
                                    <p class="font-medium">John Doe</p>
                                    <p class="text-sm text-base-content/60">john@example.com</p>
                                </div>
                            </div>
                            <button class="btn btn-ghost btn-sm btn-circle hover:bg-primary/20 hover:text-primary">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 4v16m8-8H4" />
                                </svg>
                            </button>
                        </div>

                        <div
                            class="flex items-center justify-between p-3 rounded-xl bg-base-200/50 hover:bg-base-200 transition-colors cursor-pointer">
                            <div class="flex items-center gap-3">
                                <div class="avatar placeholder">
                                    <div
                                        class="bg-gradient-to-br from-secondary to-secondary/70 text-secondary-content rounded-full w-10">
                                        <span class="text-sm font-bold">BS</span>
                                    </div>
                                </div>
                                <div>
                                    <p class="font-medium">Budi Santoso</p>
                                    <p class="text-sm text-base-content/60">budi@example.com</p>
                                </div>
                            </div>
                            <button class="btn btn-ghost btn-sm btn-circle hover:bg-primary/20 hover:text-primary">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 4v16m8-8H4" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Target Group -->
            <div class="card bg-base-100 shadow-lg border border-base-300/50">
                <div class="card-body">
                    <h2 class="card-title text-lg mb-4">Pilih Group</h2>

                    <select class="select select-bordered w-full mb-4 focus:select-primary">
                        <option disabled selected>Pilih group tujuan...</option>
                        <option value="1">Administrator</option>
                        <option value="2">Operator</option>
                        <option value="3">Reseller</option>
                    </select>

                    <h3 class="font-medium text-base-content/80 mb-2">Member dalam Group</h3>

                    <div class="space-y-2 max-h-80 overflow-y-auto">
                        <!-- Sample Member -->
                        <div
                            class="flex items-center justify-between p-3 rounded-xl bg-success/10 border border-success/30">
                            <div class="flex items-center gap-3">
                                <div class="avatar placeholder online">
                                    <div
                                        class="bg-gradient-to-br from-success to-success/70 text-success-content rounded-full w-10">
                                        <span class="text-sm font-bold">OA</span>
                                    </div>
                                </div>
                                <div>
                                    <p class="font-medium">Omnip Admin</p>
                                    <p class="text-sm text-base-content/60">omnip-admin@gmail.com</p>
                                </div>
                            </div>
                            <button class="btn btn-ghost btn-sm btn-circle hover:bg-error/20 hover:text-error">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </div>
</body>

</html>
