<!DOCTYPE html>
<html layout:decorate="~{layouts/base}" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Daftar User</title>
</head>

<body>
    <div layout:fragment="content">

        <!-- Page Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-2xl font-bold text-base-content mb-2">Daftar User</h1>
                <p class="text-base-content/60">Kelola semua user dalam sistem</p>
            </div>
            <button onclick="createUserModal.showModal()" class="btn btn-primary gap-2 shadow-lg shadow-primary/30">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Tambah User
            </button>
        </div>

        <!-- Filters -->
        <div class="card bg-base-100 shadow-sm border border-base-300/50 mb-6">
            <div class="card-body py-4">
                <div class="flex flex-col lg:flex-row gap-4">
                    <div class="flex-1">
                        <label class="input input-bordered flex items-center gap-2 focus-within:input-primary">
                            <svg class="w-4 h-4 text-base-content/50" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                            <input type="search" placeholder="Cari user..." class="grow bg-transparent outline-none" />
                        </label>
                    </div>
                    <select class="select select-bordered w-full lg:w-48">
                        <option value="">Semua Status</option>
                        <option value="active">Aktif</option>
                        <option value="inactive">Nonaktif</option>
                    </select>
                    <select class="select select-bordered w-full lg:w-48">
                        <option value="">Semua Role</option>
                        <option value="ADMIN">Admin</option>
                        <option value="OPERATOR">Operator</option>
                        <option value="USER">User</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Users Table -->
        <div class="card bg-base-100 shadow-lg border border-base-300/50">
            <div class="overflow-x-auto">
                <table class="table">
                    <thead class="bg-base-200/50">
                        <tr>
                            <th><input type="checkbox" class="checkbox checkbox-sm" /></th>
                            <th>User</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Terdaftar</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Sample Row -->
                        <tr class="hover:bg-base-200/50">
                            <td><input type="checkbox" class="checkbox checkbox-sm" /></td>
                            <td>
                                <div class="flex items-center gap-3">
                                    <div class="avatar placeholder online">
                                        <div
                                            class="bg-gradient-to-br from-primary to-primary/70 text-primary-content rounded-full w-10">
                                            <span class="text-sm font-bold">OA</span>
                                        </div>
                                    </div>
                                    <div>
                                        <div class="font-bold">Omnip Admin</div>
                                        <div class="text-sm text-base-content/60">@omnip-admin</div>
                                    </div>
                                </div>
                            </td>
                            <td>omnip-admin@gmail.com</td>
                            <td><span class="badge badge-primary badge-outline">Admin</span></td>
                            <td><span class="badge badge-success gap-1"><span
                                        class="w-2 h-2 rounded-full bg-success animate-pulse"></span>Aktif</span></td>
                            <td class="text-sm text-base-content/70">26 Jan 2026</td>
                            <td>
                                <div class="dropdown dropdown-end">
                                    <button tabindex="0" class="btn btn-ghost btn-xs btn-circle">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M12 5v.01M12 12v.01M12 19v.01" />
                                        </svg>
                                    </button>
                                    <ul tabindex="0"
                                        class="dropdown-content z-[1] menu p-2 shadow-xl bg-base-100 rounded-box w-48 border border-base-300">
                                        <li><a>Edit</a></li>
                                        <li><a>Assign ke Group</a></li>
                                        <li class="text-error"><a>Hapus</a></li>
                                    </ul>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Create User Modal -->
        <dialog id="createUserModal" class="modal modal-bottom sm:modal-middle">
            <div class="modal-box max-w-2xl">
                <h3 class="text-lg font-bold mb-4">Tambah User Baru</h3>
                <form th:action="@{/api/identity/users}" method="POST">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="form-control">
                            <label class="label"><span class="label-text">Nama Lengkap</span></label>
                            <input type="text" name="name" placeholder="Masukkan nama" class="input input-bordered"
                                required />
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">Username</span></label>
                            <input type="text" name="username" placeholder="Masukkan username"
                                class="input input-bordered" required />
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">Email</span></label>
                            <input type="email" name="email" placeholder="email@contoh.com" class="input input-bordered"
                                required />
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">Password</span></label>
                            <input type="password" name="password" placeholder="••••••••" class="input input-bordered"
                                required />
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">Role</span></label>
                            <select name="role" class="select select-bordered" required>
                                <option disabled selected>Pilih role...</option>
                                <option value="USER">User</option>
                                <option value="OPERATOR">Operator</option>
                                <option value="ADMIN">Admin</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-action">
                        <form method="dialog"><button class="btn btn-ghost">Batal</button></form>
                        <button type="submit" class="btn btn-primary">Simpan</button>
                    </div>
                </form>
            </div>
            <form method="dialog" class="modal-backdrop"><button>close</button></form>
        </dialog>

    </div>
</body>

</html>
