<!DOCTYPE html>
<html layout:decorate="~{layouts/base}" xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <title>Group Management</title>
</head>

<body>
    <div layout:fragment="content">

        <!-- Page Header -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-2xl font-bold text-base-content mb-2">Group Management</h1>
                <p class="text-base-content/60">Kelola group dan atur hak akses user</p>
            </div>
            <button onclick="createGroupModal.showModal()" class="btn btn-primary gap-2 shadow-lg shadow-primary/30">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Buat Group
            </button>
        </div>

        <!-- Groups Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">

            <!-- Sample Group Card -->
            <div
                class="card bg-base-100 shadow-lg border border-base-300/50 hover:shadow-xl transition-all duration-300 group/card">
                <div class="card-body">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center gap-3">
                            <div
                                class="w-12 h-12 rounded-xl bg-gradient-to-br from-primary to-primary/70 flex items-center justify-center shadow-lg shadow-primary/30">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-lg">Administrator</h3>
                                <p class="text-sm text-base-content/60">Full system access</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-6 mt-4 pt-4 border-t border-base-300">
                        <span class="text-sm"><span class="font-bold">5</span> member</span>
                        <span class="text-sm"><span class="font-bold">12</span> permissions</span>
                    </div>
                    <div class="card-actions mt-4">
                        <a th:href="@{/user-groups}" class="btn btn-sm btn-outline btn-primary flex-1">Kelola Member</a>
                    </div>
                </div>
            </div>

            <!-- Sample Group Card 2 -->
            <div
                class="card bg-base-100 shadow-lg border border-base-300/50 hover:shadow-xl transition-all duration-300">
                <div class="card-body">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center gap-3">
                            <div
                                class="w-12 h-12 rounded-xl bg-gradient-to-br from-secondary to-secondary/70 flex items-center justify-center shadow-lg">
                                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </div>
                            <div>
                                <h3 class="font-bold text-lg">Operator</h3>
                                <p class="text-sm text-base-content/60">Manage transactions</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-6 mt-4 pt-4 border-t border-base-300">
                        <span class="text-sm"><span class="font-bold">12</span> member</span>
                        <span class="text-sm"><span class="font-bold">8</span> permissions</span>
                    </div>
                    <div class="card-actions mt-4">
                        <a th:href="@{/user-groups}" class="btn btn-sm btn-outline btn-primary flex-1">Kelola Member</a>
                    </div>
                </div>
            </div>

        </div>

        <!-- Create Group Modal -->
        <dialog id="createGroupModal" class="modal modal-bottom sm:modal-middle">
            <div class="modal-box max-w-lg">
                <h3 class="text-lg font-bold mb-4">Buat Group Baru</h3>
                <form th:action="@{/api/identity/groups}" method="POST">
                    <div class="space-y-4">
                        <div class="form-control">
                            <label class="label"><span class="label-text">Nama Group</span></label>
                            <input type="text" name="name" placeholder="Contoh: Operator Level 1"
                                class="input input-bordered" required />
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">Deskripsi</span></label>
                            <textarea name="description" placeholder="Jelaskan fungsi group..."
                                class="textarea textarea-bordered" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-action">
                        <form method="dialog"><button class="btn btn-ghost">Batal</button></form>
                        <button type="submit" class="btn btn-primary">Buat Group</button>
                    </div>
                </form>
            </div>
            <form method="dialog" class="modal-backdrop"><button>close</button></form>
        </dialog>

    </div>
</body>

</html>
