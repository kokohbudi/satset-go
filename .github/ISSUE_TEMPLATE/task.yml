name: 📌 Task
description: Task kecil yang harus diselesaikan
title: "[TASK] "
labels: [task]
assignees: []

body:
  - type: input
    id: task-title
    attributes:
      label: Judul Task
      placeholder: "Contoh: Tambahkan validasi email di form login"
    validations:
      required: true

  - type: textarea
    id: task-desc
    attributes:
      label: Deskripsi Task
      description: Jelaskan tugas ini secara singkat
      placeholder: Misalnya: Validasi agar email wajib format @ dan tidak kosong.
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Prioritas
      options:
        - P0 - Tinggi
        - P1 - Sedang
        - P2 - Rendah
