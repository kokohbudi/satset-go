# =============================================================================
# PRODUCTION CONFIGURATION - Thymeleaf & Spring Boot Optimized
# =============================================================================
# Usage: java -jar app.jar --spring.profiles.active=prod
# =============================================================================

spring:
  # ---------------------------------------------------------------------------
  # THYMELEAF - Production Optimizations
  # ---------------------------------------------------------------------------
  thymeleaf:
    cache: true                      # CRITICAL: Template caching enabled
    check-template: false            # Skip I/O check on every request
    check-template-location: false   # Skip folder existence check
    mode: HTML
    encoding: UTF-8
    servlet:
      content-type: text/html;charset=UTF-8

  # ---------------------------------------------------------------------------
  # STATIC RESOURCES - Browser Caching & Versioning
  # ---------------------------------------------------------------------------
  web:
    resources:
      cache:
        period: 31536000             # 1 year cache
        cachecontrol:
          max-age: 31536000
          cache-public: true
      chain:
        strategy:
          content:
            enabled: true            # Content-based versioning (hash in URL)
            paths: /css/**,/js/**,/img/**,/fonts/**

  # ---------------------------------------------------------------------------
  # DATABASE - Production Pool Settings
  # ---------------------------------------------------------------------------
  datasource:
    hikari:
      maximum-pool-size: 20          # Increase for production load
      minimum-idle: 5
      idle-timeout: 300000           # 5 minutes
      connection-timeout: 10000      # 10 seconds
      max-lifetime: 1800000          # 30 minutes
      leak-detection-threshold: 60000

  # ---------------------------------------------------------------------------
  # JPA/HIBERNATE - Production Settings
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate             # NEVER use update in production
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false   # Disable in production
        jdbc:
          batch_size: 50             # Larger batch for production
          order_inserts: true
          order_updates: true

# =============================================================================
# SERVER - Tomcat Production Tuning
# =============================================================================
server:
  # ---------------------------------------------------------------------------
  # COMPRESSION - Reduce bandwidth
  # ---------------------------------------------------------------------------
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024

  # ---------------------------------------------------------------------------
  # HTTP/2 - Modern protocol (requires HTTPS)
  # ---------------------------------------------------------------------------
  http2:
    enabled: true

  # ---------------------------------------------------------------------------
  # TOMCAT - Thread & Connection Tuning
  # ---------------------------------------------------------------------------
  tomcat:
    threads:
      max: 200                       # Max worker threads
      min-spare: 20                  # Keep warm threads
    max-connections: 8192            # Max concurrent connections
    accept-count: 200                # Queue size when all threads busy
    connection-timeout: 20000        # 20 seconds
    max-http-form-post-size: 10MB
    # Disable access logging in production (use reverse proxy logs)
    accesslog:
      enabled: false

  # ---------------------------------------------------------------------------
  # ERROR HANDLING - Hide stack traces
  # ---------------------------------------------------------------------------
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never

# =============================================================================
# LOGGING - Production Level (Minimal)
# =============================================================================
logging:
  level:
    root: WARN
    org.springframework: WARN
    org.springframework.boot: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF
    com.satset: INFO                  # Your app logs
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log      # Enable file logging
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

# =============================================================================
# MANAGEMENT - Actuator (Secure in production)
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    db:
      enabled: true

# =============================================================================
# DIGIFLAZZ - hard override: prod MUST hit real DF (real fulfillment + charge).
# Base application.yml defaults testing=true for dev; this forces it off in prod.
# =============================================================================
digiflazz:
  testing: false
