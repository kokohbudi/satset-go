spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  threads:
    virtual:
      enabled: true
  main:
    lazy-initialization: false
  jmx:
    enabled: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${keycloak.client-id}
            client-secret: ${keycloak.client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${keycloak.base-server-url}/realms/${keycloak.realm}
            authorization-uri: ${keycloak.base-server-url}/realms/${keycloak.realm}/protocol/openid-connect/auth
            token-uri: ${keycloak.base-server-url}/realms/${keycloak.realm}/protocol/openid-connect/token
            user-info-uri: ${keycloak.base-server-url}/realms/${keycloak.realm}/protocol/openid-connect/userinfo
            jwk-set-uri: ${keycloak.base-server-url}/realms/${keycloak.realm}/protocol/openid-connect/certs
            logout-uri: ${keycloak.base-server-url}/realms/${keycloak.realm}/protocol/openid-connect/logout
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.base-server-url}/realms/${keycloak.realm}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/satset_go?socketTimeout=30&connectTimeout=10&tcpKeepAlive=true}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 2000
      leak-detection-threshold: 60000
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        connection:
          provider_disables_autocommit: false
        query:
          plan_cache_max_size: 4096
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
        cache:
          use_second_level_cache: false
          use_query_cache: false
  thymeleaf:
    cache: false   # dev: re-read templates per request (live edits + impeccable live mode). prod overrides to true.
keycloak:
  realm: ${KEYCLOAK_REALM:satset-go}
  base-server-url: ${KEYCLOAK_BASE_URL:http://localhost:9999}
  client-id: ${KEYCLOAK_CLIENT_ID:satsetgo-client}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:dummy-secret}

topup:
  reconcile:
    interval-ms: 60000       # @Scheduled fixedDelay between sweeps
    stale-after-ms: 120000   # a row must be older than this to be swept
    batch-size: 100          # max rows per run (rate-limit guard vs DF rc 85)
    max-age-ms: 21600000     # 6h — past this, stop re-polling and ALERT for manual Ops

digiflazz:
  base-url: ${DIGIFLAZZ_BASE_URL:https://api.digiflazz.com/v1}
  username: ${DIGIFLAZZ_USERNAME:}
  api-key: ${DIGIFLAZZ_DEV_KEY:}
  # DEV default TRUE = kirim "testing":true → DF balikin respons kaleng utk test customer_no
  # (087800001230=Sukses, 087800001233=Pending→Sukses) TANPA charge deposit asli.
  # Prod overlay (application-prod.yml) MEMAKSA false. Override lokal: DIGIFLAZZ_TESTING=false.
  testing: ${DIGIFLAZZ_TESTING:true}

# Performance optimizations
server:
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  tomcat:
    max-connections: 8192
    accept-count: 100
    connection-timeout: 20000

logging:
  level:
    root: INFO
    org.springframework.boot: INFO
    # SECURITY: Changed from DEBUG to INFO to prevent sensitive data leakage
    org.springframework.security: INFO
    org.hibernate: INFO
    # Keep application logging for troubleshooting, but consider INFO in production
    com.satset: INFO
    org.apache.catalina: INFO
    org.apache.tomcat: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

