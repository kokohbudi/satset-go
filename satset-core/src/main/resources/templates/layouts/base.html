<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security" x-data="{
        sidebarOpen: window.innerWidth >= 1024 ? (localStorage.getItem('sidebarOpen') === 'true' || localStorage.getItem('sidebarOpen') === null) : false 
    }" x-init="$watch('sidebarOpen', val => localStorage.setItem('sidebarOpen', val))"
    xmlns:x-transition="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Satset Go Dashboard">Dashboard</title>

    <!-- CSRF token (Spring Security). Reading ${_csrf} here forces token generation per page. -->
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <!-- Auto-attach CSRF header to mutating same-origin fetch — covers all page JS in one place. -->
    <script>
        (function () {
            const origFetch = window.fetch;
            const token = document.querySelector('meta[name="_csrf"]')?.content;
            const header = document.querySelector('meta[name="_csrf_header"]')?.content;
            window.fetch = function (input, init) {
                init = init || {};
                const method = (init.method || (typeof input === 'object' && input.method) || 'GET').toUpperCase();
                if (token && header && !['GET', 'HEAD', 'OPTIONS', 'TRACE'].includes(method)) {
                    init.headers = new Headers(init.headers || {});
                    if (!init.headers.has(header)) init.headers.set(header, token);
                }
                return origFetch.call(this, input, init);
            };
        })();
    </script>

    <!-- Local Compiled CSS (Tailwind + DaisyUI) -->
    <link rel="stylesheet" th:href="@{/css/output.css}" />

    <!-- Theme + sidebar state initialization (before paint, prevents load-time content shift) -->
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'satset-light';
            document.documentElement.setAttribute('data-theme', theme);

            // Pre-paint layout markers (cleared on alpine:initialized) so the first frame
            // matches the resolved sidebar state — no content shift, no sidebar flash.
            const root = document.documentElement;
            root.classList.add('pre-alpine');
            const sb = localStorage.getItem('sidebarOpen');
            if ((sb === null || sb === 'true') && window.innerWidth >= 1024) {
                root.classList.add('sidebar-initial-open');
            }
        })();
    </script>

    <!-- Alpine.js -->
    <script defer th:src="@{/js/alpine.min.js}"></script>

    <!-- Debug Alpine.js -->
    <script>
        document.addEventListener('alpine:initialized', () => {
            // Alpine now owns the sidebar + content margin via :class; drop the pre-paint
            // markers so they never override the toggled state.
            document.documentElement.classList.remove('pre-alpine', 'sidebar-initial-open');
        });
    </script>

    <!-- CSS Fallback for sidebar -->
    <style>
        [x-cloak] {
            display: none !important;
        }

        /* Numeric input without spinner arrows (keeps type=number numeric-only).
           Global: the up/down spinners are noisy in dense tables and forms. */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button,
        .no-spinner::-webkit-inner-spin-button,
        .no-spinner::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number],
        .no-spinner { -moz-appearance: textfield; appearance: textfield; }

        /* Skip-to-content link: hidden until keyboard-focused (a11y, WCAG 2.4.1) */
        .skip-link {
            position: absolute;
            left: 0.75rem;
            top: -4rem;
            z-index: 70;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            background: hsl(var(--p));
            color: hsl(var(--pc));
            font-weight: 600;
            transition: top 0.2s ease;
        }

        .skip-link:focus {
            top: 0.75rem;
        }

        /* Skip-link target is programmatically focused; suppress the stray outline */
        #app-content:focus {
            outline: none;
        }

        /* Entrance: blocks settle in on load. backwards fill keeps the element hidden
           only until its staggered turn, then reverts to base state so :hover transforms
           (e.g. card lift) are not pinned by the animation's final frame. */
        @keyframes rise-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-rise {
            animation: rise-in 0.45s cubic-bezier(0.25, 1, 0.5, 1) backwards;
            animation-delay: calc(var(--i, 0) * 70ms);
        }

        /* Pre-Alpine layout: make the first paint match the resolved sidebar state so
           there is no content shift and no sidebar flash. All scoped to .pre-alpine,
           which alpine:initialized removes once Alpine owns the bindings. */
        @media (min-width: 1024px) {
            html.pre-alpine.sidebar-initial-open #app-content {
                margin-left: 18rem;
            }

            html.pre-alpine:not(.sidebar-initial-open) #app-sidebar {
                transform: translateX(-100%);
            }

            html.pre-alpine:not(.sidebar-initial-open) #app-breadcrumb {
                padding-left: 3.5rem;
            }
        }

        /* Reduced-motion: honor user preference globally (WCAG 2.3.3) */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }

            /* Kill the staggered entrance entirely so content is visible instantly */
            .animate-rise {
                animation: none !important;
            }
        }

        /* Smooth transitions for sidebar */
        .sidebar-transition {
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
        }

        /* ============================================
           Shared interaction motion (product register)
           Conveys state — hover/press/row — at 150–250ms.
           Opt-in via class so static surfaces stay still.
           The global prefers-reduced-motion rule above already
           neutralizes these transitions; no extra guard needed.
           ============================================ */

        /* Clickable cards / tiles lift on hover, settle on press */
        .lift {
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .lift:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 28px -18px rgba(15, 23, 42, 0.35);
        }
        .lift:active {
            transform: translateY(-1px);
        }

        /* Clickable non-button elements give a press cue */
        .press {
            transition: transform 0.12s ease-out;
        }
        .press:active {
            transform: scale(0.97);
        }

        /* Icon / ghost buttons: snappier tap feel */
        .tap {
            transition: transform 0.12s ease-out, background-color 0.15s ease;
        }
        .tap:active {
            transform: scale(0.92);
        }

        /* Table rows fade their hover state instead of snapping */
        .table tbody tr {
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        /* Self-contained table scroll region: own vertical + horizontal
           scrollbars so the horizontal bar stays in view (not buried under
           every row) when the table is wider than its column — e.g. sidebar
           open. Sticky header keeps column labels while scrolling rows. */
        .denom-scroll {
            overflow: auto;
            max-height: calc(100vh - 23rem);
        }
        .denom-scroll thead th {
            position: sticky;
            top: 0;
            z-index: 3;
            /* elevated header surface + a quiet neutral divider
               (orange is reserved for actions only, not table chrome) */
            background: oklch(var(--b3));
            box-shadow: inset 0 -1px 0 oklch(var(--bc) / 0.14);
            transition: box-shadow 200ms cubic-bezier(0.25, 1, 0.5, 1);
        }
        /* Header lifts into depth once rows scroll beneath it (scroll state) */
        .denom-scroll.is-scrolled thead th {
            box-shadow: inset 0 -1px 0 oklch(var(--bc) / 0.14),
                        0 8px 14px -10px oklch(0% 0 0 / 0.55);
        }
        /* Quieter outline buttons — softens the stark full-contrast border
           on secondary tool buttons in dark mode. */
        .btn-quiet {
            border-color: oklch(var(--bc) / 0.25);
        }

        /* Brand focus ring on text controls — orange = interaction, and the
           DaisyUI default here resolves to a transparent (invisible) outline.
           Warning inputs keep their amber ring (that's a state, not focus). */
        .input:focus,
        .input:focus-within,
        .select:focus,
        .textarea:focus {
            outline: 2px solid oklch(var(--p));
            outline-offset: 2px;
        }
        .input-warning:focus,
        .input-warning:focus-within {
            outline-color: oklch(var(--wa));
        }
        /* Ease the border color when a cell flips to a dirty/unpriced state,
           so the warning fades in on edit instead of snapping. */
        .input, .select, .textarea {
            transition: border-color 150ms cubic-bezier(0.25, 1, 0.5, 1);
        }
        /* Neutral row hover — orange is reserved for actions, not passive chrome,
           so it doesn't compete with the amber warning cues in the table. */
        .denom-scroll tbody tr:hover td {
            background-color: oklch(var(--bc) / 0.05);
        }
        /* Unpriced denom: amber wash on the Harga Jual cell = still needs a price */
        .cell-unpriced {
            background-color: oklch(var(--wa) / 0.12);
        }
        /* Indeterminate loading bar: a bright highlight sweeps across a dim
           full-width track (always on-screen, unlike a translated segment). */
        @keyframes loadbar {
            from { background-position: 200% 0; }
            to   { background-position: -200% 0; }
        }
        /* Always-visible scrollbars (macOS overlay bars hide by default) */
        .denom-scroll::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        .denom-scroll::-webkit-scrollbar-thumb {
            background: oklch(var(--bc) / 0.25);
            border-radius: 5px;
        }
        .denom-scroll::-webkit-scrollbar-thumb:hover {
            background: oklch(var(--bc) / 0.4);
        }
        .denom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        /* ============================================
           Floating Label Input Component Styles
           ============================================ */
        .floating-input-wrapper {
            position: relative;
        }

        .floating-input {
            display: block !important;
            width: 100% !important;
            height: auto !important;
            padding: 1rem 0.875rem 0.5rem !important;
            border: 1px solid hsl(var(--bc) / 0.2) !important;
            border-radius: 0.5rem !important;
            background-color: transparent !important;
            color: inherit !important;
            font-size: 1rem !important;
            transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
        }

        .floating-input:focus {
            outline: none !important;
            border-color: #f97316 !important;
            box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.15) !important;
        }

        .floating-input.input-error {
            border-color: hsl(var(--er)) !important;
        }

        .floating-input.input-error:focus {
            box-shadow: 0 0 0 3px hsl(var(--er) / 0.25) !important;
        }

        .floating-label {
            position: absolute;
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            padding: 0 0.25rem;
            font-size: 1rem;
            color: inherit;
            opacity: 0.6;
            pointer-events: none;
            transition: all 0.2s ease;
            background-color: transparent;
        }

        /* Label floats up when input is focused or has value */
        .floating-input:focus~.floating-label,
        .floating-input:not(:placeholder-shown)~.floating-label {
            top: 0;
            transform: translateY(-50%);
            font-size: 0.75rem;
            color: #f97316;
            opacity: 1;
            background-color: hsl(var(--b1, 0 0% 100%));
            padding: 0 0.375rem;
        }

        .floating-input.input-error:focus~.floating-label,
        .floating-input.input-error:not(:placeholder-shown)~.floating-label {
            color: hsl(var(--er));
        }
    </style>

    <!-- Page Specific Head Content -->
    <th:block layout:fragment="head"></th:block>
</head>

<body class="bg-base-200 min-h-screen font-sans antialiased">

    <a href="#app-content" class="skip-link">Lewati ke konten utama</a>

    <!-- Sidebar Toggle: body-level fixed button (no transformed/filtered ancestor) so it
         resolves to the viewport and stays in one place whether the sidebar is open or closed.
         z-[60] keeps it above the sidebar (z-50). Desktop only; mobile uses the bottom nav. -->
    <button @click="sidebarOpen = !sidebarOpen"
        class="btn btn-ghost btn-circle hidden lg:flex fixed top-2.5 left-3 z-[60]" title="Toggle Sidebar"
        aria-label="Buka/tutup sidebar">
        <svg th:replace="~{components/icons :: icon-menu(class='w-5 h-5')}"></svg>
    </button>

    <div class="flex min-h-screen">
        <!-- Sidebar Component -->
        <div th:replace="~{components/sidebar :: sidebar}"></div>

        <!-- Main Content Area -->
        <div id="app-content" tabindex="-1" class="flex-1 flex flex-col min-w-0 transition-all duration-300 ease-in-out focus:outline-none"
            :class="sidebarOpen ? 'lg:ml-72' : 'ml-0'">

            <!-- Header Component -->
            <div th:replace="~{components/header :: header}"></div>

            <!-- Page Content -->
            <main class="flex-1 p-6 lg:p-8 pb-24 lg:pb-8">
                <div layout:fragment="content" class="max-w-7xl mx-auto">
                </div>
            </main>

            <!-- Footer -->
            <footer class="py-4 px-6 text-center text-sm text-base-content/60 border-t border-base-300">
                <p>&copy; 2026 Satset Go. Konter Pulsa Management System.</p>
            </footer>
        </div>
    </div>

    <!-- Bottom Navigation (Mobile Only) -->
    <div th:replace="~{components/bottom-nav :: bottom-nav}"></div>

    <!-- Global Toast Component (Alpine Store) -->
    <div x-data x-init="
        Alpine.store('toast', {
            show: false,
            message: '',
            type: 'success',
            timeout: null,
            
            success(msg, duration = 3000) {
                this.display(msg, 'success', duration);
            },
            error(msg, duration = 4000) {
                this.display(msg, 'error', duration);
            },
            info(msg, duration = 3000) {
                this.display(msg, 'info', duration);
            },
            display(msg, type, duration) {
                if (this.timeout) clearTimeout(this.timeout);
                this.message = msg;
                this.type = type;
                this.show = true;
                this.timeout = setTimeout(() => this.show = false, duration);
            }
        });
    "></div>

    <!-- Toast Container (Bottom Right) -->
    <div class="toast toast-bottom toast-end z-[9999] pointer-events-none">
        <div x-data x-show="$store.toast.show" x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
            x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0"
            x-transition:leave-end="opacity-0 translate-y-2" class="alert shadow-lg pointer-events-auto" :class="{
                 'alert-success': $store.toast.type === 'success',
                 'alert-error': $store.toast.type === 'error',
                 'alert-info': $store.toast.type === 'info'
             }">
            <span x-text="$store.toast.message"></span>
        </div>
    </div>

    <!-- Flash Message → Toast Bridge (Server-side flash attributes trigger Alpine toast) -->
    <div th:if="${toastMessage != null}" x-data
        x-init="$nextTick(() => $store.toast[$el.dataset.type || 'success']($el.dataset.msg))"
        th:data-msg="${toastMessage}" th:data-type="${toastType}" class="hidden">
    </div>

    <!-- Confirm Dialog Store -->
    <div x-data x-init="
        Alpine.store('confirm', {
            show: false,
            title: '',
            message: '',
            confirmText: 'Ya',
            cancelText: 'Batal',
            confirmClass: 'btn-error',
            resolve: null,

            async open(options = {}) {
                this.title = options.title || 'Konfirmasi';
                this.message = options.message || 'Apakah Anda yakin?';
                this.confirmText = options.confirmText || 'Ya';
                this.cancelText = options.cancelText || 'Batal';
                this.confirmClass = options.confirmClass || 'btn-error';
                this.show = true;
                
                return new Promise((resolve) => {
                    this.resolve = resolve;
                });
            },
            
            confirm() {
                this.show = false;
                if (this.resolve) this.resolve(true);
            },
            
            cancel() {
                this.show = false;
                if (this.resolve) this.resolve(false);
            }
        });
    ">
        <!-- Confirm Dialog Modal (inside same x-data to ensure store is ready) -->
        <div x-show="$store.confirm.show" x-cloak class="fixed inset-0 z-[9999] flex items-center justify-center"
            x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
            <!-- Backdrop -->
            <div class="absolute inset-0 bg-black/50" @click="$store.confirm.cancel()"></div>

            <!-- Dialog Box -->
            <div class="relative bg-base-100 rounded-xl shadow-2xl w-full max-w-md mx-4 overflow-hidden"
                x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95"
                x-transition:enter-end="opacity-100 scale-100" x-transition:leave="transition ease-in duration-150"
                x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95">

                <!-- Header -->
                <div class="px-6 py-4 border-b border-base-300">
                    <h3 class="text-lg font-semibold" x-text="$store.confirm.title"></h3>
                </div>

                <!-- Body -->
                <div class="px-6 py-5">
                    <p class="text-base-content/80" x-text="$store.confirm.message"></p>
                </div>

                <!-- Footer -->
                <div class="px-6 py-4 bg-base-200/50 flex justify-end gap-3">
                    <button class="btn btn-ghost" @click="$store.confirm.cancel()"
                        x-text="$store.confirm.cancelText"></button>
                    <button class="btn" :class="$store.confirm.confirmClass" @click="$store.confirm.confirm()"
                        x-text="$store.confirm.confirmText"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Page Specific Scripts -->
    <th:block layout:fragment="scripts"></th:block>

</body>

</html>
