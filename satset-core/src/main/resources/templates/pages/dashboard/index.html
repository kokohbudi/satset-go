<!DOCTYPE html>
<html layout:decorate="~{layouts/base}" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>

<head>
    <title>Dashboard</title>
</head>

<body>
    <div layout:fragment="content">

        <!-- Page Header -->
        <div class="mb-8 animate-rise" style="--i: 0">
            <h1 class="text-2xl font-bold tracking-tight text-base-content mb-2">Dashboard</h1>
            <p class="text-base-content/70">Selamat datang di Omnip Server Pulsa Management System</p>
        </div>

        <!-- Stats — Tier 1: money & today's pulse (what you check first) -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6 animate-rise" style="--i: 1">
            <!-- Total Balance (hero) — only users with transaction role -->
            <div sec:authorize="hasRole('CLIENT_transaction')"
                class="bg-base-100 rounded-2xl p-6 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 border border-base-300/50 lg:col-span-2">
                <div class="flex items-start justify-between h-full">
                    <div class="space-y-2">
                        <p class="text-sm font-medium text-base-content/70 uppercase tracking-wider">Total Saldo</p>
                        <p class="text-4xl font-bold tracking-tight tabular-nums text-base-content"
                            th:text="${totalBalance != null} ? ${totalBalance} : 'Rp 45.2M'">Rp 45.2M</p>
                        <div class="flex items-center gap-1 text-success">
                            <span class="text-sm font-medium">+8%</span>
                            <span class="text-xs text-base-content/70">vs bulan lalu</span>
                        </div>
                    </div>
                    <div class="w-16 h-16 rounded-2xl bg-base-200 flex items-center justify-center">
                        <svg class="w-8 h-8 text-base-content/70" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Transactions Today — only users with transaction role -->
            <div sec:authorize="hasRole('CLIENT_transaction')"
                class="bg-base-100 rounded-2xl p-6 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 border border-base-300/50">
                <div class="flex items-start justify-between">
                    <div class="space-y-2">
                        <p class="text-sm font-medium text-base-content/70 uppercase tracking-wider">Transaksi Hari Ini
                        </p>
                        <p class="text-3xl font-bold tracking-tight tabular-nums text-base-content"
                            th:text="${transactionsToday != null} ? ${transactionsToday} : '567'">567</p>
                        <div class="flex items-center gap-1 text-success">
                            <span class="text-sm font-medium">+23%</span>
                            <span class="text-xs text-base-content/70">vs kemarin</span>
                        </div>
                    </div>
                    <div class="w-14 h-14 rounded-2xl bg-base-200 flex items-center justify-center">
                        <svg class="w-7 h-7 text-base-content/70" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Stats — Tier 2: reference counts (compact, secondary) -->
        <div class="grid grid-cols-1 gap-6 mb-8 animate-rise" style="--i: 2">
            <!-- Total Resellers — only users with view_users realm role -->
            <div sec:authorize="hasRole('REALM_view_users')"
                class="bg-base-100 rounded-2xl p-4 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 border border-base-300/50">
                <div class="flex items-center justify-between">
                    <div class="space-y-2">
                        <p class="text-sm font-medium text-base-content/70 uppercase tracking-wider">Total Reseller</p>
                        <p class="text-2xl font-bold tabular-nums text-base-content"
                            th:text="${totalResellers}">0</p>
                    </div>
                    <div class="w-12 h-12 rounded-xl bg-base-200 flex items-center justify-center">
                        <svg class="w-6 h-6 text-base-content/70" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197" />
                        </svg>
                    </div>
                </div>
            </div>

        </div>

        <!-- Secondary zone: Aksi Cepat (wider, primary) + Status Sistem (glanceable, narrow) -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8 animate-rise" style="--i: 3">

        <!-- Quick Menu (user-pinned). Live-synced on pin toggle via GET /quick-menu/card.
             `contents` wrapper generates no box, so the card (or nothing) sits directly in the grid. -->
        <div id="quickMenuSlot" class="contents">
            <div th:replace="~{components/quick-menu-card :: card}"></div>
        </div>

        <!-- System Status -->
        <div class="card bg-base-100 shadow-sm border border-base-300/50">
            <div class="card-body">
                <h2 class="card-title text-lg font-bold flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-success animate-pulse"></span>
                    Status Sistem
                </h2>
                <div class="grid grid-cols-3 gap-4 mt-2">
                    <div class="text-center">
                        <p class="text-2xl font-bold text-success">Online</p>
                        <p class="text-xs text-base-content/70">Server Status</p>
                    </div>
                    <div class="text-center">
                        <p class="text-2xl font-bold tabular-nums text-base-content">45ms</p>
                        <p class="text-xs text-base-content/70">Response Time</p>
                    </div>
                    <div class="text-center">
                        <p class="text-2xl font-bold tabular-nums text-base-content">99.9%</p>
                        <p class="text-xs text-base-content/70">Uptime</p>
                    </div>
                </div>
            </div>
        </div>

        </div>
        <!-- /Secondary zone -->

    </div>
</body>

</html>
