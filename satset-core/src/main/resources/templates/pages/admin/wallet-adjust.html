<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/base}">

<head>
    <title>Inject Saldo</title>
</head>

<body>
<div layout:fragment="content" x-data="walletAdjust()">

    <!-- Page Header -->
    <div class="mb-6">
        <h1 class="text-2xl font-bold">Inject Saldo</h1>
        <p class="text-base-content/60 text-sm mt-1">Top-up manual saldo wallet tanpa pembayaran. Tercatat sebagai
            mutasi <span class="font-mono">ADJUSTMENT</span> untuk audit.</p>
    </div>

    <!-- Search -->
    <div class="mb-4">
        <label class="input input-bordered input-sm flex items-center gap-2 w-full max-w-xs">
            <svg class="w-4 h-4 text-base-content/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="search" x-model="searchQuery" placeholder="Cari Wallet ID / email / konter..." class="grow bg-transparent outline-none"/>
        </label>
    </div>

    <!-- Table -->
    <div class="card bg-base-100 shadow-sm">
        <div class="overflow-x-auto">
            <table class="table table-zebra">
                <thead>
                <tr>
                    <th>Konter</th>
                    <th>Wallet ID</th>
                    <th class="text-right">Saldo</th>
                    <th>Update Terakhir</th>
                    <th class="text-center">Aksi</th>
                </tr>
                </thead>
                <tbody>
                <template x-for="w in filteredWallets" :key="w.walletId">
                    <tr>
                        <td>
                            <div class="font-medium" x-text="w.storeName || '—'"></div>
                            <div class="text-sm text-base-content/60" x-text="w.email || '—'"></div>
                        </td>
                        <td class="font-mono text-sm" x-text="w.walletId"></td>
                        <td class="text-right font-mono tabular-nums" x-text="rupiah(w.balance)"></td>
                        <td class="text-sm text-base-content/60" x-text="w.updatedAt ? new Date(w.updatedAt).toLocaleString('id-ID') : '-'"></td>
                        <td class="text-center">
                            <div class="flex justify-center gap-1">
                                <button class="btn btn-primary btn-xs" @click="openInject(w)">Inject</button>
                                <button class="btn btn-ghost btn-xs" @click="openMutations(w)">Mutasi</button>
                            </div>
                        </td>
                    </tr>
                </template>
                <tr x-show="filteredWallets.length === 0">
                    <td colspan="5" class="text-center py-8 text-base-content/50">Belum ada wallet</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Inject Modal -->
    <div x-show="showModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center"
         x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
        <div class="absolute inset-0 bg-black/50" @click="showModal = false"></div>
        <div class="relative bg-base-100 rounded-xl shadow-2xl w-full max-w-md mx-4 overflow-hidden"
             x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100">

            <div class="px-6 py-4 border-b border-base-300">
                <h3 class="text-lg font-semibold" x-text="target.storeName || 'Inject Saldo'"></h3>
                <p class="text-sm text-base-content/60 mt-0.5">
                    <span x-show="target.email" x-text="target.email"></span>
                    <span x-show="target.email">&middot;</span>
                    Wallet <span class="font-mono" x-text="target.walletId"></span>
                    &middot; saldo <span class="font-medium" x-text="rupiah(target.balance)"></span></p>
            </div>

            <form @submit.prevent="submitInject()">
                <div class="px-6 py-5 space-y-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text">Jumlah (Rp)</span></label>
                        <input type="number" min="1" step="1" class="input input-bordered" x-model.number="form.amount"
                               required placeholder="cth: 50000" :disabled="saving" autofocus>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Keterangan</span>
                            <span class="label-text-alt text-base-content/50">Opsional</span></label>
                        <input type="text" class="input input-bordered" x-model="form.description" maxlength="255"
                               placeholder="cth: koreksi manual" :disabled="saving">
                    </div>
                </div>

                <div class="px-6 py-4 bg-base-200/50 flex justify-end gap-3">
                    <button type="button" class="btn btn-ghost" @click="showModal = false" :disabled="saving">Batal</button>
                    <button type="submit" class="btn btn-primary" :disabled="saving">
                        <span x-show="saving" class="loading loading-spinner loading-sm"></span>
                        <span>Inject</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Mutations Modal -->
    <div x-show="showMutations" x-cloak class="fixed inset-0 z-50 flex items-center justify-center">
        <div class="absolute inset-0 bg-black/50" @click="showMutations = false"></div>
        <div class="relative bg-base-100 rounded-xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden">
            <div class="px-6 py-4 border-b border-base-300 flex items-center justify-between">
                <div>
                    <h3 class="text-lg font-semibold">Mutasi Saldo</h3>
                    <p class="text-sm text-base-content/60 mt-0.5">
                        <span x-text="target.storeName || '—'"></span> &middot;
                        Wallet <span class="font-mono" x-text="target.walletId"></span></p>
                </div>
                <button class="btn btn-sm btn-circle btn-ghost" @click="showMutations = false">✕</button>
            </div>
            <div class="max-h-[60vh] overflow-y-auto">
                <table class="table table-sm">
                    <thead class="sticky top-0 bg-base-100">
                        <tr>
                            <th>Waktu</th>
                            <th>Tipe</th>
                            <th class="text-right">Jumlah</th>
                            <th class="text-right">Saldo Akhir</th>
                            <th>Keterangan</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr x-show="mutasiLoading"><td colspan="5" class="text-center py-10">
                            <span class="loading loading-spinner text-primary"></span></td></tr>
                        <template x-for="m in mutations" :key="m.createdAt + m.balanceAfter">
                            <tr>
                                <td class="text-sm whitespace-nowrap" x-text="m.createdAt ? new Date(m.createdAt).toLocaleString('id-ID') : '-'"></td>
                                <td><span class="badge badge-sm" :class="isCredit(m.type) ? 'badge-success' : 'badge-error'" x-text="mutationLabel(m)"></span></td>
                                <td class="text-right font-mono tabular-nums" :class="isCredit(m.type) ? 'text-success' : 'text-error'"
                                    x-text="(isCredit(m.type) ? '+' : '-') + rupiah(m.amount)"></td>
                                <td class="text-right font-mono tabular-nums" x-text="rupiah(m.balanceAfter)"></td>
                                <td class="text-sm text-base-content/70" x-text="m.description || '-'"></td>
                            </tr>
                        </template>
                        <tr x-show="!mutasiLoading && mutations.length === 0">
                            <td colspan="5" class="text-center py-10 text-base-content/50">Belum ada mutasi.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script th:inline="javascript">
    const INITIAL_WALLETS = /*[[${initialWallets}]]*/ [];

    function walletAdjust() {
        return {
            wallets: INITIAL_WALLETS,
            searchQuery: '',
            showModal: false,
            saving: false,
            showMutations: false,
            mutations: [],
            mutasiLoading: false,
            target: { walletId: '', balance: 0, storeName: '', email: '' },
            form: { amount: null, description: '' },

            rupiah(v) {
                return 'Rp ' + new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(v || 0);
            },

            get filteredWallets() {
                if (!this.searchQuery) return this.wallets;
                const q = this.searchQuery.toLowerCase();
                return this.wallets.filter(w =>
                    w.walletId.toLowerCase().includes(q) ||
                    (w.email && w.email.toLowerCase().includes(q)) ||
                    (w.storeName && w.storeName.toLowerCase().includes(q))
                );
            },

            openInject(w) {
                this.target = w;
                this.form = { amount: null, description: '' };
                this.showModal = true;
            },

            async openMutations(w) {
                this.target = w;
                this.mutations = [];
                this.mutasiLoading = true;
                this.showMutations = true;
                try {
                    const res = await fetch(`/api/admin/wallets/${w.walletId}/mutations`);
                    if (!res.ok) throw new Error('Gagal memuat mutasi');
                    this.mutations = await res.json();
                } catch (e) {
                    Alpine.store('toast').error(e.message);
                } finally {
                    this.mutasiLoading = false;
                }
            },

            isCredit(type) { return type === 'CREDIT' || type === 'REFUND'; },
            mutationLabel(m) {
                const map = { TRANSACTION: 'Pembelian', TOPUP: 'Top-up', REFUND: 'Refund', ADJUSTMENT: 'Penyesuaian' };
                return map[m.referenceType] || m.type;
            },

            async submitInject() {
                this.saving = true;
                try {
                    const res = await fetch(`/api/admin/wallets/${this.target.walletId}/adjust`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ amount: this.form.amount, description: this.form.description })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok || data.status !== 'success') {
                        throw new Error(data.message || 'Gagal inject saldo');
                    }
                    // Update row balance in place from server response.
                    this.target.balance = data.balance;
                    this.showModal = false;
                    Alpine.store('toast').success('Saldo berhasil di-inject');
                } catch (e) {
                    Alpine.store('toast').error(e.message);
                } finally {
                    this.saving = false;
                }
            }
        };
    }
</script>
</th:block>
</body>
</html>
