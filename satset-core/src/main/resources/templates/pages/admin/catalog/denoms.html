<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/base}">

<head>
    <title>Denominasi</title>
</head>

<body>
<div layout:fragment="content" x-data="denomManager()" x-init="loadCompare()"
     th:data-can-manage="${#authorization.expression('hasRole(''REALM_manage_denoms'')')}">

    <!-- Breadcrumb -->
    <div class="text-sm breadcrumbs mb-4 animate-rise" style="--i:0">
        <ul>
            <li><a href="/admin/catalog/categories">Katalog</a></li>
            <li>
                <a :href="categoryId
                    ? '/admin/catalog/products?categoryId=' + categoryId + '&categoryName=' + encodeURIComponent(categoryName)
                    : '/admin/catalog/products'"
                   x-text="categoryName || 'Produk'"></a>
            </li>
            <li class="font-semibold" x-text="productName || 'Denominasi'"></li>
        </ul>
    </div>

    <!-- Page Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4 animate-rise" style="--i:1">
        <div>
            <h1 class="text-2xl font-bold" x-text="productName ? 'Denom: ' + productName : 'Denominasi'"></h1>
            <p class="text-base-content/60 text-sm mt-1">Kelola denominasi (harga, nominal, tipe)</p>
        </div>
        <div class="flex gap-2">
            <button x-show="dirtyList.length > 0" x-cloak class="btn btn-warning tap"
                    @click="openPriceModal()">
                Simpan Harga (<span x-text="dirtyList.length"></span>)
            </button>
            <button sec:authorize="hasRole('REALM_manage_denoms')" class="btn btn-outline tap"
                    @click="openSyncDenoms()" :disabled="syncing">
                <span x-show="syncing" class="loading loading-spinner loading-xs"></span>
                Sync Denom DF
            </button>
            <button sec:authorize="hasRole('REALM_manage_denoms')" class="btn btn-primary tap" @click="openCreateModal()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/>
                </svg>
                Tambah Denom
            </button>
        </div>
    </div>

    <!-- Search -->
    <div class="mb-4 animate-rise" style="--i:2">
        <label class="input input-bordered input-sm flex items-center gap-2 w-full max-w-xs">
            <svg class="w-4 h-4 text-base-content/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="search" x-model="searchQuery" placeholder="Cari denominasi..." class="grow bg-transparent outline-none"/>
        </label>
    </div>

    <!-- Unpriced Warning -->
    <div x-show="unpricedCount > 0" x-cloak class="alert alert-warning py-2 mb-4 flex items-center justify-between">
        <span>⚠ <b x-text="unpricedCount"></b> denom belum ada harga jual</span>
        <button class="btn btn-xs tap" @click="filterUnpriced = !filterUnpriced"
                x-text="filterUnpriced ? 'Tampilkan semua' : 'Tampilkan'"></button>
    </div>

    <!-- Table -->
    <div class="card bg-base-100 shadow-sm animate-rise" style="--i:3">
        <div class="overflow-x-auto">
            <table class="table table-zebra table-sm">
                <thead>
                <tr>
                    <th>Code</th>
                    <th>Nama</th>
                    <th>Tipe</th>
                    <th class="text-right">Nominal</th>
                    <th class="text-right">Harga Jual</th>
                    <th class="text-right">Harga Modal</th>
                    <th class="text-right">Harga DF</th>
                    <th class="text-center">Sort</th>
                    <th class="text-center">Status</th>
                    <th class="text-center">Aksi</th>
                </tr>
                </thead>
                <tbody>
                <template x-for="d in filteredDenoms" :key="d.id">
                    <tr :class="d.deleted ? 'opacity-40' : ''">
                        <td class="font-mono text-xs" x-text="d.code"></td>
                        <td x-text="d.name"></td>
                        <td><span class="badge badge-xs"
                                  :class="d.denomType === 'FIXED_DENOM' ? 'badge-info' : 'badge-accent'"
                                  x-text="d.denomType === 'FIXED_DENOM' ? 'Fixed' : 'Open Amount'"></span></td>
                        <td class="text-right font-mono" x-text="formatRp(d.nominal)"></td>
                        <td class="text-right">
                            <template x-if="canManage && !d.deleted">
                                <input type="number" min="1" step="any"
                                       class="input input-bordered input-xs w-28 text-right font-mono no-spinner"
                                       :class="isDirty(d) ? 'input-warning' : ''"
                                       :value="pendingPrice(d)"
                                       @change="setPrice(d, $event.target.value)"/>
                            </template>
                            <template x-if="!canManage || d.deleted">
                                <span class="font-mono" x-text="formatRp(d.price)"></span>
                            </template>
                        </td>
                        <td class="text-right font-mono" x-text="formatRp(d.basePrice)"></td>
                        <td class="text-right">
                            <template x-if="dfInfo(d.code)">
                                <span :class="dfInfo(d.code).status === 'NAIK' ? 'text-error' : dfInfo(d.code).status === 'TURUN' ? 'text-success' : ''"
                                      x-text="dfInfo(d.code).dfCost != null ? new Intl.NumberFormat('id-ID').format(dfInfo(d.code).dfCost) : '-'"></span>
                            </template>
                            <template x-if="!dfInfo(d.code)"><span class="text-base-content/40">-</span></template>
                        </td>
                        <td class="text-center" x-text="d.sortOrder"></td>
                        <td class="text-center">
                            <span class="badge badge-sm"
                                  :class="d.deleted ? 'badge-error' : (d.active ? 'badge-success' : 'badge-warning')"
                                  x-text="d.deleted ? 'Deleted' : (d.active ? 'Active' : 'Inactive')"></span>
                            <span x-show="d.inSupplier === false" class="badge badge-warning badge-outline badge-sm ml-1"
                                  title="Hilang dari supplier">⚠ supplier</span>
                        </td>
                        <td class="text-center">
                            <div class="flex justify-center gap-1">
                                <template x-if="canManage">
                                    <button class="btn btn-ghost btn-xs tap" @click="openEditModal(d)" :disabled="d.deleted">Edit</button>
                                </template>
                                <template x-if="canManage">
                                    <button class="btn btn-ghost btn-xs text-error tap" @click="confirmDelete(d)" :disabled="d.deleted">Hapus</button>
                                </template>
                            </div>
                        </td>
                    </tr>
                </template>
                <tr x-show="filteredDenoms.length === 0">
                    <td colspan="10" class="text-center py-8 text-base-content/50">Belum ada denominasi</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div x-show="showModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center"
         x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
        <div class="absolute inset-0 bg-black/50" @click="showModal = false"></div>
        <div class="relative bg-base-100 rounded-xl shadow-2xl w-full max-w-2xl mx-4 overflow-hidden"
             x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100">

            <div class="px-6 py-4 border-b border-base-300">
                <h3 class="text-lg font-semibold" x-text="editMode ? 'Edit Denominasi' : 'Tambah Denominasi'"></h3>
            </div>

            <form @submit.prevent="saveDenom()">
                <div class="px-6 py-5 space-y-4 max-h-[70vh] overflow-y-auto">
                    <div class="grid grid-cols-2 gap-4">
                        <div class="form-control">
                            <label class="label"><span class="label-text">Code / SKU</span></label>
                            <input type="text" class="input input-bordered input-sm" x-model="form.code" maxlength="100"
                                   placeholder="kosongkan → auto PRODUK+NOMINAL" :disabled="saving">
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">Tipe</span></label>
                            <select class="select select-bordered select-sm" x-model="form.denomType" required :disabled="saving">
                                <option value="">-- Pilih --</option>
                                <template x-for="t in denomTypes" :key="t">
                                    <option :value="t" x-text="t"></option>
                                </template>
                            </select>
                        </div>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Nama</span></label>
                        <input type="text" class="input input-bordered input-sm" x-model="form.name" required maxlength="150" :disabled="saving">
                    </div>

                    <!-- Pricing -->
                    <div class="divider text-xs">Pricing</div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="form-control">
                            <label class="label"><span class="label-text text-xs">Nominal</span></label>
                            <input type="number" step="0.01" class="input input-bordered input-sm" x-model.number="form.nominal" :disabled="saving">
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text text-xs">Harga Jual</span></label>
                            <input type="number" step="0.01" class="input input-bordered input-sm" x-model.number="form.price" required :disabled="saving">
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text text-xs">Harga Modal</span></label>
                            <input type="number" step="0.01" class="input input-bordered input-sm" x-model.number="form.basePrice" :disabled="saving">
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text text-xs">Admin Fee</span></label>
                            <input type="number" step="0.01" class="input input-bordered input-sm" x-model.number="form.adminFee" :disabled="saving">
                        </div>
                    </div>

                    <!-- Extra fields -->
                    <div class="divider text-xs">Detail</div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="form-control">
                            <label class="label"><span class="label-text text-xs">Validity (hari)</span></label>
                            <input type="number" class="input input-bordered input-sm" x-model.number="form.validityDays" :disabled="saving">
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text text-xs">Kuota (MB)</span></label>
                            <input type="number" class="input input-bordered input-sm" x-model.number="form.quotaMb" :disabled="saving">
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text text-xs">Min Amount</span></label>
                            <input type="number" step="0.01" class="input input-bordered input-sm" x-model.number="form.minAmount" :disabled="saving">
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text text-xs">Max Amount</span></label>
                            <input type="number" step="0.01" class="input input-bordered input-sm" x-model.number="form.maxAmount" :disabled="saving">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="form-control">
                            <label class="label"><span class="label-text text-xs">Stok</span></label>
                            <input type="number" class="input input-bordered input-sm" x-model.number="form.stockAvailable" :disabled="saving">
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text text-xs">Sort Order</span></label>
                            <input type="number" class="input input-bordered input-sm" x-model.number="form.sortOrder" :disabled="saving">
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text text-xs">Status</span></label>
                            <label class="label cursor-pointer justify-start gap-2">
                                <input type="checkbox" class="toggle toggle-primary toggle-sm" x-model="form.active" :disabled="saving">
                                <span class="label-text text-xs" x-text="form.active ? 'Active' : 'Inactive'"></span>
                            </label>
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text text-xs">Inquiry</span></label>
                            <label class="label cursor-pointer justify-start gap-2">
                                <input type="checkbox" class="toggle toggle-sm" x-model="form.requiresInquiry" :disabled="saving">
                                <span class="label-text text-xs" x-text="form.requiresInquiry ? 'Ya' : 'Tidak'"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="px-6 py-4 bg-base-200/50 flex justify-end gap-3">
                    <button type="button" class="btn btn-ghost" @click="showModal = false" :disabled="saving">Batal</button>
                    <button type="submit" class="btn btn-primary" :disabled="saving">
                        <span x-show="saving" class="loading loading-spinner loading-sm"></span>
                        <span x-text="editMode ? 'Update' : 'Simpan'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Sync Preview Modal -->
    <div class="modal" :class="{ 'modal-open': showSyncModal }">
        <div class="modal-box max-w-2xl">
            <h3 class="font-bold text-lg" x-text="syncTitle">Preview Sync</h3>
            <template x-for="grp in ['ADD','UPDATE','DELETE']" :key="grp">
                <div x-show="syncGroup(grp).length" class="mt-4">
                    <div class="flex items-center justify-between">
                        <span class="font-semibold text-sm"
                              x-text="grp === 'ADD' ? '➕ Tambah' : grp === 'UPDATE' ? '✏️ Update harga' : '🗑️ Hapus'"></span>
                        <label class="label cursor-pointer gap-2 text-xs">
                            <span>pilih semua</span>
                            <input type="checkbox" class="checkbox checkbox-xs"
                                   :checked="syncGroup(grp).every(i => i.checked)"
                                   @change="toggleGroup(grp, $event.target.checked)">
                        </label>
                    </div>
                    <div class="max-h-48 overflow-y-auto mt-1">
                        <template x-for="it in syncGroup(grp)" :key="it.key">
                            <label class="flex items-center gap-2 py-1 text-sm cursor-pointer">
                                <input type="checkbox" class="checkbox checkbox-sm" x-model="it.checked">
                                <span x-text="it.label"></span>
                                <span class="text-xs text-base-content/50" x-show="it.detail" x-text="it.detail"></span>
                            </label>
                        </template>
                    </div>
                </div>
            </template>
            <div class="modal-action">
                <button class="btn btn-ghost" @click="showSyncModal = false" :disabled="syncing">Batal</button>
                <button class="btn btn-primary"
                        @click="confirmSync('/api/admin/catalog/products/' + productId + '/sync/denoms', async () => { await loadDenoms(); await loadCompare(); })"
                        :disabled="syncing">
                    <span x-show="syncing" class="loading loading-spinner loading-xs"></span> Terapkan
                </button>
            </div>
        </div>
    </div>

    <!-- Bulk Price Confirm Modal -->
    <div th:replace="~{fragments/denom-price-confirm-modal :: modal}"></div>
</div>

<th:block layout:fragment="scripts">
<!-- no defer: must define window.denomPriceEditing before Alpine (defer, head) auto-starts -->
<script th:src="@{/js/denom-price-editing.js}"></script>
<script th:inline="javascript">
    const PRODUCT_ID = /*[[${productId}]]*/ '';
    const DENOM_TYPES = /*[[${denomTypes}]]*/ [];
    const INITIAL_DENOMS = /*[[${initialDenoms}]]*/ [];
    const INITIAL_PRODUCT = /*[[${initialProduct}]]*/ null;

    function denomManager() {
        const c = {
            canManage: document.querySelector('[data-can-manage]')?.dataset.canManage === 'true',
            productId: PRODUCT_ID,
            productName: INITIAL_PRODUCT ? INITIAL_PRODUCT.name : '',
            categoryId: INITIAL_PRODUCT ? (INITIAL_PRODUCT.categoryId || '') : '',
            categoryName: INITIAL_PRODUCT ? (INITIAL_PRODUCT.categoryName || '') : '',
            denomTypes: DENOM_TYPES,
            denoms: INITIAL_DENOMS,
            searchQuery: '',
            showModal: false,
            editMode: false,
            saving: false,
            editId: null,
            syncing: false,
            showSyncModal: false,
            syncItems: [],
            syncTitle: '',
            compareBySku: {},
            form: {
                code: '', name: '', denomType: '', nominal: null, price: null,
                basePrice: null, adminFee: null, validityDays: null, quotaMb: null,
                minAmount: null, maxAmount: null, requiresInquiry: false,
                stockAvailable: null, active: true, sortOrder: 0
            },

            get filteredDenoms() {
                if (this.filterUnpriced && this.unpricedCount === 0) this.filterUnpriced = false; // auto-reset: banner+toggle hilang saat count 0
                let list = this.denoms;
                if (this.filterUnpriced) list = list.filter(d => !d.deleted && d.price == null);
                if (!this.searchQuery) return list;
                const q = this.searchQuery.toLowerCase();
                return list.filter(d =>
                    d.code.toLowerCase().includes(q) ||
                    d.name.toLowerCase().includes(q) ||
                    (d.denomType && d.denomType.toLowerCase().includes(q))
                );
            },

            async loadDenoms() {
                try {
                    const res = await fetch(`/api/admin/catalog/products/${this.productId}/denoms`);
                    this.denoms = await res.json();
                } catch (e) {
                    Alpine.store('toast').error('Gagal memuat denominasi');
                }
            },

            async loadCompare() {
                try {
                    const res = await fetch(`/api/admin/catalog/products/${this.productId}/pricelist-compare`);
                    if (!res.ok) return;
                    const rows = await res.json();
                    const map = {};
                    rows.forEach(r => { if (r.buyerSku) map[r.buyerSku.toUpperCase()] = r; });
                    this.compareBySku = map;
                } catch (e) { /* diam: delta opsional */ }
            },

            // ponytail: space after `[` — `[(` is Thymeleaf's escaped-inline marker in th:inline="javascript"
            dfInfo(code) { const k = (code || '').toUpperCase(); return this.compareBySku[k] || null; },

            async openSyncDenoms() {
                this.syncing = true; this.syncTitle = 'Sync Denom';
                try {
                    const res = await fetch(`/api/admin/catalog/products/${this.productId}/pricelist-compare`);
                    if (!res.ok) throw new Error('gagal');
                    const rows = await res.json();
                    const map = { BARU: 'ADD', NAIK: 'UPDATE', TURUN: 'UPDATE', HILANG: 'DELETE' };
                    this.syncItems = rows.filter(r => r.status !== 'SAMA').map(r => ({
                        action: map[r.status], key: r.buyerSku, label: r.productName || r.buyerSku,
                        detail: r.status === 'HILANG' ? 'hilang dari DF'
                              : (r.dfCost != null ? 'Rp ' + new Intl.NumberFormat('id-ID').format(r.dfCost) : ''),
                        checked: r.status !== 'HILANG'   // DELETE default off
                    }));
                    if (this.syncItems.length === 0) { Alpine.store('toast').success('Denom sudah sinkron'); return; }
                    this.showSyncModal = true;
                } catch (e) { Alpine.store('toast').error('Gagal ambil preview'); }
                finally { this.syncing = false; }
            },
            syncGroup(action) { return this.syncItems.filter(i => i.action === action); },
            toggleGroup(action, val) { this.syncItems.forEach(i => { if (i.action === action) i.checked = val; }); },
            async confirmSync(applyUrl, reload) {
                const keys = this.syncItems.filter(i => i.checked).map(i => i.key);
                this.syncing = true;
                try {
                    const res = await fetch(applyUrl, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(keys) });
                    if (!res.ok) throw new Error('gagal');
                    const r = await res.json();
                    Alpine.store('toast').success(`Selesai: +${r.added} baru, ${r.updated} update, ${r.deleted} hapus, ${r.failed} gagal`);
                    this.showSyncModal = false;
                    await reload();
                } catch (e) { Alpine.store('toast').error('Gagal sync'); }
                finally { this.syncing = false; }
            },

            formatRp(val) {
                if (val == null) return '-';
                return new Intl.NumberFormat('id-ID').format(val);
            },

            emptyForm() {
                return {
                    code: '', name: '', denomType: '', nominal: null, price: null,
                    basePrice: null, adminFee: null, validityDays: null, quotaMb: null,
                    minAmount: null, maxAmount: null, requiresInquiry: false,
                    stockAvailable: null, active: true, sortOrder: 0
                };
            },

            openCreateModal() {
                this.editMode = false;
                this.editId = null;
                this.form = this.emptyForm();
                this.showModal = true;
            },

            openEditModal(d) {
                this.editMode = true;
                this.editId = d.id;
                this.form = {
                    code: d.code, name: d.name, denomType: d.denomType,
                    nominal: d.nominal, price: d.price, basePrice: d.basePrice,
                    adminFee: d.adminFee, validityDays: d.validityDays, quotaMb: d.quotaMb,
                    minAmount: d.minAmount, maxAmount: d.maxAmount,
                    requiresInquiry: d.requiresInquiry, stockAvailable: d.stockAvailable,
                    active: d.active, sortOrder: d.sortOrder
                };
                this.showModal = true;
            },

            async saveDenom() {
                this.saving = true;
                try {
                    const url = this.editMode
                        ? `/api/admin/catalog/denoms/${this.editId}`
                        : `/api/admin/catalog/products/${this.productId}/denoms`;
                    const method = this.editMode ? 'PUT' : 'POST';
                    const res = await fetch(url, {
                        method, headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.form)
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        throw new Error(err.errorMessage || err.message || 'Gagal menyimpan');
                    }
                    this.showModal = false;
                    await this.loadDenoms();
                    Alpine.store('toast').success(this.editMode ? 'Denom diperbarui' : 'Denom ditambahkan');
                } catch (e) {
                    Alpine.store('toast').error(e.message);
                } finally {
                    this.saving = false;
                }
            },

            async confirmDelete(d) {
                const ok = await Alpine.store('confirm').open({
                    title: 'Hapus Denominasi',
                    message: `Yakin hapus denom "${d.name}"?`,
                    confirmText: 'Hapus', confirmClass: 'btn-error'
                });
                if (!ok) return;
                try {
                    const res = await fetch(`/api/admin/catalog/denoms/${d.id}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error('Gagal menghapus');
                    await this.loadDenoms();
                    Alpine.store('toast').success('Denom dihapus');
                } catch (e) {
                    Alpine.store('toast').error(e.message);
                }
            }
        };
        // Copy shared price-editing state/getters/methods onto c WITHOUT invoking getters.
        // (Object spread would eager-call `get unpricedCount` before `denoms` exists → TypeError,
        //  and would freeze getters into static values, killing reactivity.)
        Object.defineProperties(c, Object.getOwnPropertyDescriptors(window.denomPriceEditing(() => c.denoms)));
        return c;
    }
</script>
</th:block>
</body>
</html>
