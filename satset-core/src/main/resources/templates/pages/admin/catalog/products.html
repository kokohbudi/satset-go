<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/base}">

<head>
    <title>Produk</title>
</head>

<body>
<div layout:fragment="content" x-data="productManager()"
     th:data-can-manage="${#authorization.expression('hasRole(''REALM_manage_products'')')}">

    <!-- Tab Navigation (when accessed directly, not from category drill-down) -->
    <th:block th:if="${categoryName == null or categoryName.isEmpty()}">
        <div role="tablist" class="tabs tabs-bordered mb-6 animate-rise" style="--i:0">
            <a role="tab" class="tab" href="/admin/catalog/categories">Kategori</a>
            <a role="tab" class="tab tab-active">Semua Produk</a>
            <a role="tab" class="tab" href="/admin/catalog/denoms">Semua Denom</a>
        </div>
    </th:block>

    <!-- Breadcrumb (only when navigated from category drill-down) -->
    <div th:if="${categoryName != null and !categoryName.isEmpty()}" class="text-sm breadcrumbs mb-4 animate-rise" style="--i:0">
        <ul>
            <li><a href="/admin/catalog/categories">Katalog</a></li>
            <li class="font-semibold" th:text="${categoryName}">Nama Kategori</li>
        </ul>
    </div>

    <!-- Page Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4 animate-rise" style="--i:1">
        <div>
            <h1 class="text-2xl font-bold">Produk</h1>
            <p class="text-base-content/60 text-sm mt-1">Kelola produk per kategori (Telkomsel, XL, PLN, dll)</p>
        </div>
        <div class="flex gap-2">
            <button x-show="nameDirtyList.length > 0" x-cloak class="btn btn-warning tap" @click="openNameModal()">
                Simpan Nama (<span x-text="nameDirtyList.length"></span>)
            </button>
            <button sec:authorize="hasRole('REALM_manage_products')" class="btn btn-outline tap"
                    @click="openSync('/api/admin/catalog/categories/' + filterCategoryId + '/sync/products/preview', 'Sync Produk')"
                    :disabled="syncing || !filterCategoryId"
                    :title="filterCategoryId ? '' : 'Pilih kategori dulu'">
                <span x-show="syncing" class="loading loading-spinner loading-xs"></span>
                Sync Produk DF
            </button>
            <button sec:authorize="hasRole('REALM_manage_products')" class="btn btn-primary tap" @click="openCreateModal()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/>
                </svg>
                Tambah Produk
            </button>
        </div>
    </div>

    <!-- Filter & Search -->
    <div class="flex flex-col sm:flex-row gap-3 mb-4 animate-rise" style="--i:2">
        <select class="select select-bordered select-sm w-full max-w-xs" x-model="filterCategoryId" @change="loadProducts()">
            <option value="">Semua Kategori</option>
            <template x-for="cat in categories" :key="cat.id">
                <option :value="cat.id" x-text="cat.name"></option>
            </template>
        </select>
        <label class="input input-bordered input-sm flex items-center gap-2 w-full max-w-xs">
            <svg class="w-4 h-4 text-base-content/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="search" x-model="searchQuery" placeholder="Cari produk..." class="grow bg-transparent outline-none"/>
        </label>
    </div>

    <!-- Loading (shown only during category filter reload) -->
    <div x-show="loading" class="flex justify-center py-12">
        <span class="loading loading-spinner loading-lg text-primary"></span>
    </div>

    <!-- Table -->
    <div x-show="!loading" x-cloak class="card bg-base-100 shadow-sm animate-rise" style="--i:3">
        <div class="overflow-x-auto">
            <table class="table table-zebra">
                <thead>
                <tr>
                    <th>Code</th>
                    <th>Nama</th>
                    <th>Provider</th>
                    <th>Kategori</th>
                    <th class="text-center">Sort</th>
                    <th class="text-center">Status</th>
                    <th class="text-center">Aksi</th>
                </tr>
                </thead>
                <tbody>
                <template x-for="prod in filteredProducts" :key="prod.id">
                    <tr :class="prod.deleted ? 'opacity-40' : ''">
                        <td class="font-mono text-sm" x-text="prod.code"></td>
                        <td>
                            <template x-if="canManage && !prod.deleted">
                                <input type="text" maxlength="100"
                                       class="input input-bordered input-xs w-44"
                                       :class="isNameDirty(prod) ? 'input-warning' : ''"
                                       :value="pendingName(prod)"
                                       @change="setName(prod, $event.target.value)"/>
                            </template>
                            <template x-if="!canManage || prod.deleted">
                                <a :href="'/admin/catalog/products/' + prod.id + '/denoms'"
                                   class="link link-hover link-primary" x-text="prod.name"></a>
                            </template>
                        </td>
                        <td x-text="prod.providerName || '-'"></td>
                        <td>
                            <span x-show="catName(prod.categoryId)" class="badge badge-outline badge-sm" x-text="catName(prod.categoryId)"></span>
                            <span x-show="!catName(prod.categoryId)" class="text-base-content/40">-</span>
                        </td>
                        <td class="text-center" x-text="prod.sortOrder"></td>
                        <td class="text-center">
                            <span class="badge badge-sm"
                                  :class="prod.deleted ? 'badge-error' : (prod.active ? 'badge-success' : 'badge-warning')"
                                  x-text="prod.deleted ? 'Deleted' : (prod.active ? 'Active' : 'Inactive')"></span>
                            <span x-show="prod.inSupplier === false" class="badge badge-warning badge-outline badge-sm ml-1"
                                  title="Hilang dari supplier">⚠ supplier</span>
                        </td>
                        <td class="text-center">
                            <div class="flex justify-center gap-1">
                                <a :href="'/admin/catalog/products/' + prod.id + '/denoms'"
                                   class="btn btn-ghost btn-xs tap">Denoms</a>
                                <template x-if="canManage">
                                    <button class="btn btn-ghost btn-xs tap" @click="openEditModal(prod)" :disabled="prod.deleted">Edit</button>
                                </template>
                                <template x-if="canManage">
                                    <button class="btn btn-ghost btn-xs text-error tap" @click="confirmDelete(prod)" :disabled="prod.deleted">Hapus</button>
                                </template>
                            </div>
                        </td>
                    </tr>
                </template>
                <tr x-show="filteredProducts.length === 0">
                    <td colspan="7" class="text-center py-8 text-base-content/50">Belum ada produk</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div x-show="showModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center"
         x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
        <div class="absolute inset-0 bg-black/50" @click="showModal = false"></div>
        <div class="relative bg-base-100 rounded-xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden"
             x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100">

            <div class="px-6 py-4 border-b border-base-300">
                <h3 class="text-lg font-semibold" x-text="editMode ? 'Edit Produk' : 'Tambah Produk'"></h3>
            </div>

            <form @submit.prevent="saveProduct()">
                <div class="px-6 py-5 space-y-4 max-h-[70vh] overflow-y-auto">
                    <div class="form-control">
                        <label class="label"><span class="label-text">Kategori</span></label>
                        <select class="select select-bordered" x-model="form.categoryId" required :disabled="saving">
                            <option value="">-- Pilih Kategori --</option>
                            <template x-for="cat in categories" :key="cat.id">
                                <option :value="cat.id" x-text="cat.name"></option>
                            </template>
                        </select>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Code</span></label>
                        <input type="text" class="input input-bordered" x-model="form.code" required maxlength="50" :disabled="saving">
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Nama</span></label>
                        <input type="text" class="input input-bordered" x-model="form.name" required maxlength="100" :disabled="saving">
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Provider</span></label>
                        <input type="text" class="input input-bordered" x-model="form.providerName" maxlength="100" :disabled="saving">
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Deskripsi</span></label>
                        <textarea class="textarea textarea-bordered" x-model="form.description" rows="2" :disabled="saving"></textarea>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Icon URL</span></label>
                        <input type="text" class="input input-bordered" x-model="form.iconUrl" :disabled="saving">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="form-control">
                            <label class="label"><span class="label-text">Sort Order</span></label>
                            <input type="number" class="input input-bordered" x-model.number="form.sortOrder" :disabled="saving">
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">Status</span></label>
                            <label class="label cursor-pointer justify-start gap-3">
                                <input type="checkbox" class="toggle toggle-primary" x-model="form.active" :disabled="saving">
                                <span class="label-text" x-text="form.active ? 'Active' : 'Inactive'"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="px-6 py-4 bg-base-200/50 flex justify-end gap-3">
                    <button type="button" class="btn btn-ghost" @click="showModal = false" :disabled="saving">Batal</button>
                    <button type="submit" class="btn btn-primary" :disabled="saving">
                        <span x-show="saving" class="loading loading-spinner loading-sm"></span>
                        <span x-text="editMode ? 'Update' : 'Simpan'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Sync Preview Modal -->
    <div class="modal" :class="{ 'modal-open': showSyncModal }">
        <div class="modal-box max-w-2xl">
            <h3 class="font-bold text-lg" x-text="syncTitle">Preview Sync</h3>
            <template x-for="grp in ['ADD','UPDATE','DELETE']" :key="grp">
                <div x-show="syncGroup(grp).length" class="mt-4">
                    <div class="flex items-center justify-between">
                        <span class="font-semibold text-sm"
                              x-text="grp === 'ADD' ? '➕ Tambah' : grp === 'UPDATE' ? '✏️ Update harga' : '🗑️ Hapus'"></span>
                        <label class="label cursor-pointer gap-2 text-xs">
                            <span>pilih semua</span>
                            <input type="checkbox" class="checkbox checkbox-xs"
                                   :checked="syncGroup(grp).every(i => i.checked)"
                                   @change="toggleGroup(grp, $event.target.checked)">
                        </label>
                    </div>
                    <div class="max-h-48 overflow-y-auto mt-1">
                        <template x-for="it in syncGroup(grp)" :key="it.key">
                            <label class="flex items-center gap-2 py-1 text-sm cursor-pointer">
                                <input type="checkbox" class="checkbox checkbox-sm" x-model="it.checked">
                                <span x-text="it.label"></span>
                                <span class="text-xs text-base-content/50" x-show="it.detail" x-text="it.detail"></span>
                            </label>
                        </template>
                    </div>
                </div>
            </template>
            <div class="modal-action">
                <button class="btn btn-ghost" @click="showSyncModal = false" :disabled="syncing">Batal</button>
                <button class="btn btn-primary" @click="confirmSync('/api/admin/catalog/categories/' + filterCategoryId + '/sync/products', () => loadProducts())" :disabled="syncing">
                    <span x-show="syncing" class="loading loading-spinner loading-xs"></span> Terapkan
                </button>
            </div>
        </div>
    </div>

    <!-- Bulk Name Confirm Modal -->
    <div class="modal" :class="{ 'modal-open': showNameModal }">
        <div class="modal-box max-w-xl">
            <h3 class="text-lg font-semibold mb-4">Konfirmasi Perubahan Nama</h3>
            <div class="overflow-x-auto max-h-80">
                <table class="table table-sm">
                    <thead>
                    <tr>
                        <th>Code</th>
                        <th>Nama Lama</th>
                        <th>Nama Baru</th>
                        <th class="text-center" x-show="nameResults.length">Hasil</th>
                    </tr>
                    </thead>
                    <tbody>
                    <template x-for="item in nameDirtyList" :key="item.id">
                        <tr>
                            <td class="font-mono text-xs" x-text="item.code"></td>
                            <td x-text="item.oldName"></td>
                            <td class="font-semibold" x-text="item.newName"></td>
                            <td class="text-center" x-show="nameResults.length">
                                <template x-if="nameResultFor(item.id)">
                                    <span class="badge badge-sm"
                                          :class="nameResultFor(item.id).ok ? 'badge-success' : 'badge-error'"
                                          :title="nameResultFor(item.id).error || ''"
                                          x-text="nameResultFor(item.id).ok ? 'OK' : (nameResultFor(item.id).error || 'Gagal')"></span>
                                </template>
                            </td>
                        </tr>
                    </template>
                    </tbody>
                </table>
            </div>
            <div class="modal-action">
                <button class="btn btn-ghost" @click="showNameModal = false" :disabled="savingNames">Batal</button>
                <button class="btn btn-warning" @click="submitNames()" :disabled="savingNames">
                    <span x-show="savingNames" class="loading loading-spinner loading-xs"></span>
                    Konfirmasi
                </button>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script th:inline="javascript">
    const INITIAL_CATEGORY_ID = /*[[${categoryId}]]*/ '';
    const INITIAL_CATEGORIES = /*[[${initialCategories}]]*/ [];
    const INITIAL_PRODUCTS = /*[[${initialProducts}]]*/ [];

    function productManager() {
        return {
            canManage: document.querySelector('[data-can-manage]')?.dataset.canManage === 'true',
            categories: INITIAL_CATEGORIES.filter(c => !c.deleted),
            products: INITIAL_PRODUCTS,
            filterCategoryId: INITIAL_CATEGORY_ID,
            searchQuery: '',
            loading: false,
            showModal: false,
            editMode: false,
            saving: false,
            editId: null,
            syncing: false,
            showSyncModal: false,
            syncItems: [],
            syncTitle: '',
            form: { categoryId: '', code: '', name: '', providerName: '', description: '', iconUrl: '', sortOrder: 0, active: true },
            nameDirty: {},
            showNameModal: false,
            savingNames: false,
            nameResults: [],

            get filteredProducts() {
                if (!this.searchQuery) return this.products;
                const q = this.searchQuery.toLowerCase();
                return this.products.filter(p =>
                    p.code.toLowerCase().includes(q) ||
                    p.name.toLowerCase().includes(q) ||
                    (p.providerName && p.providerName.toLowerCase().includes(q)) ||
                    this.catName(p.categoryId).toLowerCase().includes(q)
                );
            },

            catName(id) { return (this.categories.find(c => c.id === id) || {}).name || ''; },

            // === Inline name editing (accumulate + bulk confirm) ===
            get nameDirtyList() { return Object.values(this.nameDirty); },
            isNameDirty(p) { return !!this.nameDirty[p.id]; },
            pendingName(p) { return this.nameDirty[p.id] ? this.nameDirty[p.id].newName : p.name; },
            nameResultFor(id) { return this.nameResults.find(r => r.id === id); },
            setName(p, val) {
                const name = (val ?? '').trim();
                if (name === '' || name === p.name) delete this.nameDirty[p.id];
                else this.nameDirty[p.id] = { id: p.id, code: p.code, oldName: p.name, newName: name };
            },
            openNameModal() { this.nameResults = []; this.showNameModal = true; },
            async submitNames() {
                this.savingNames = true;
                try {
                    const res = await fetch('/api/admin/catalog/products/names', {
                        method: 'PUT', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.nameDirtyList.map(x => ({ id: x.id, name: x.newName })))
                    });
                    if (!res.ok) throw new Error('Gagal menyimpan nama');
                    this.nameResults = await res.json();
                    const okCount = this.nameResults.filter(r => r.ok).length;
                    const failCount = this.nameResults.length - okCount;
                    for (const r of this.nameResults) { if (r.ok) delete this.nameDirty[r.id]; }
                    await this.loadProducts();
                    if (failCount === 0) {
                        this.showNameModal = false;
                        Alpine.store('toast').success(`${okCount} nama diperbarui`);
                    } else {
                        Alpine.store('toast').error(`${failCount} gagal disimpan, ${okCount} sukses`);
                    }
                } catch (e) {
                    Alpine.store('toast').error(e.message);
                } finally {
                    this.savingNames = false;
                }
            },

            async loadProducts() {
                this.loading = true;
                try {
                    const url = this.filterCategoryId
                        ? `/api/admin/catalog/products?categoryId=${this.filterCategoryId}`
                        : '/api/admin/catalog/products';
                    const res = await fetch(url);
                    this.products = await res.json();
                } catch (e) {
                    Alpine.store('toast').error('Gagal memuat produk');
                } finally {
                    this.loading = false;
                }
            },

            async openSync(previewUrl, title) {
                this.syncing = true; this.syncTitle = title;
                try {
                    const res = await fetch(previewUrl);
                    if (!res.ok) throw new Error('gagal');
                    const raw = await res.json();
                    this.syncItems = raw.map(i => ({ ...i, checked: i.action !== 'DELETE' })); // DELETE default off
                    if (this.syncItems.length === 0) { Alpine.store('toast').success('Sudah sinkron dengan Digiflazz'); return; }
                    this.showSyncModal = true;
                } catch (e) { Alpine.store('toast').error('Gagal ambil preview'); }
                finally { this.syncing = false; }
            },
            syncGroup(action) { return this.syncItems.filter(i => i.action === action); },
            toggleGroup(action, val) { this.syncItems.forEach(i => { if (i.action === action) i.checked = val; }); },
            async confirmSync(applyUrl, reload) {
                const keys = this.syncItems.filter(i => i.checked).map(i => i.key);
                this.syncing = true;
                try {
                    const res = await fetch(applyUrl, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(keys) });
                    if (!res.ok) throw new Error('gagal');
                    const r = await res.json();
                    Alpine.store('toast').success(`Selesai: +${r.added} baru, ${r.updated} update, ${r.deleted} hapus, ${r.failed} gagal`);
                    this.showSyncModal = false;
                    await reload();
                } catch (e) { Alpine.store('toast').error('Gagal sync'); }
                finally { this.syncing = false; }
            },

            openCreateModal() {
                this.editMode = false;
                this.editId = null;
                this.form = { categoryId: this.filterCategoryId || '', code: '', name: '', providerName: '', description: '', iconUrl: '', sortOrder: 0, active: true };
                this.showModal = true;
            },

            openEditModal(prod) {
                this.editMode = true;
                this.editId = prod.id;
                this.form = {
                    categoryId: prod.categoryId, code: prod.code, name: prod.name,
                    providerName: prod.providerName || '', description: prod.description || '',
                    iconUrl: prod.iconUrl || '', sortOrder: prod.sortOrder, active: prod.active
                };
                this.showModal = true;
            },

            async saveProduct() {
                this.saving = true;
                try {
                    const url = this.editMode
                        ? `/api/admin/catalog/products/${this.editId}`
                        : '/api/admin/catalog/products';
                    const method = this.editMode ? 'PUT' : 'POST';
                    const res = await fetch(url, {
                        method, headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.form)
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        throw new Error(err.errorMessage || err.message || 'Gagal menyimpan');
                    }
                    this.showModal = false;
                    await this.loadProducts();
                    Alpine.store('toast').success(this.editMode ? 'Produk diperbarui' : 'Produk ditambahkan');
                } catch (e) {
                    Alpine.store('toast').error(e.message);
                } finally {
                    this.saving = false;
                }
            },

            async confirmDelete(prod) {
                const ok = await Alpine.store('confirm').open({
                    title: 'Hapus Produk',
                    message: `Yakin hapus produk "${prod.name}"? Semua denominasi di bawahnya akan ikut dihapus.`,
                    confirmText: 'Hapus', confirmClass: 'btn-error'
                });
                if (!ok) return;
                try {
                    const res = await fetch(`/api/admin/catalog/products/${prod.id}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error('Gagal menghapus');
                    await this.loadProducts();
                    Alpine.store('toast').success('Produk dihapus');
                } catch (e) {
                    Alpine.store('toast').error(e.message);
                }
            }
        };
    }
</script>
</th:block>
</body>
</html>
