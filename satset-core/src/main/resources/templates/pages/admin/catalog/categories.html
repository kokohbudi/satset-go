<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layouts/base}">

<head>
    <title>Kategori Produk</title>
</head>

<body>
<div layout:fragment="content" x-data="categoryManager()"
     th:data-can-manage="${#authorization.expression('hasRole(''REALM_manage_categories'')')}">

    <!-- Tab Navigation -->
    <div role="tablist" class="tabs tabs-bordered mb-6 animate-rise" style="--i:0">
        <a role="tab" class="tab tab-active">Kategori</a>
        <a role="tab" class="tab" href="/admin/catalog/products">Semua Produk</a>
    </div>

    <!-- Page Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-4 animate-rise" style="--i:1">
        <div>
            <h1 class="text-2xl font-bold">Kategori Produk</h1>
            <p class="text-base-content/60 text-sm mt-1">Kelola kategori produk (Pulsa, Data, Game, PLN, dll)</p>
        </div>
        <div class="flex gap-2">
            <button sec:authorize="hasRole('REALM_manage_categories')" class="btn btn-secondary tap"
                    @click="syncAll()" :disabled="syncing">
                <span x-show="syncing" class="loading loading-spinner loading-xs"></span>
                Sync Supplier
            </button>
            <button sec:authorize="hasRole('REALM_manage_categories')" class="btn btn-outline tap"
                    @click="openSync('/api/admin/catalog/sync/categories/preview', 'Sync Kategori')" :disabled="syncing">
                <span x-show="syncing" class="loading loading-spinner loading-xs"></span>
                Sync Kategori
            </button>
            <button sec:authorize="hasRole('REALM_manage_categories')" class="btn btn-primary tap" @click="openCreateModal()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/>
                </svg>
                Tambah Kategori
            </button>
        </div>
    </div>

    <!-- Search -->
    <div class="mb-4 animate-rise" style="--i:2">
        <label class="input input-bordered input-sm flex items-center gap-2 w-full max-w-xs">
            <svg class="w-4 h-4 text-base-content/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
            <input type="search" x-model="searchQuery" placeholder="Cari kategori..." class="grow bg-transparent outline-none"/>
        </label>
    </div>

    <!-- Table -->
    <div class="card bg-base-100 shadow-sm animate-rise" style="--i:3">
        <div class="overflow-x-auto">
            <table class="table table-zebra">
                <thead>
                <tr>
                    <th>Code</th>
                    <th>Nama</th>
                    <th>Tipe</th>
                    <th class="text-center">Sort</th>
                    <th class="text-center">Status</th>
                    <th class="text-center">Aksi</th>
                </tr>
                </thead>
                <tbody>
                <template x-for="cat in filteredCategories" :key="cat.id">
                    <tr :class="cat.deleted ? 'opacity-40' : ''">
                        <td class="font-mono text-sm" x-text="cat.code"></td>
                        <td x-text="cat.name"></td>
                        <td>
                            <span class="badge badge-outline badge-sm" x-text="cat.categoryType"></span>
                        </td>
                        <td class="text-center" x-text="cat.sortOrder"></td>
                        <td class="text-center">
                            <span class="badge badge-sm"
                                  :class="cat.deleted ? 'badge-error' : (cat.active ? 'badge-success' : 'badge-warning')"
                                  x-text="cat.deleted ? 'Deleted' : (cat.active ? 'Active' : 'Inactive')"></span>
                            <span x-show="cat.inSupplier === false" class="badge badge-warning badge-outline badge-sm ml-1"
                                  title="Hilang dari supplier">⚠ supplier</span>
                        </td>
                        <td class="text-center">
                            <div class="flex justify-center gap-1">
                                <a :href="'/admin/catalog/products?categoryId=' + cat.id + '&categoryName=' + encodeURIComponent(cat.name)"
                                   class="btn btn-ghost btn-xs tap" :class="cat.deleted ? 'btn-disabled' : ''">Produk &rarr;</a>
                                <template x-if="canManage">
                                    <button class="btn btn-ghost btn-xs tap" @click="openEditModal(cat)" :disabled="cat.deleted">Edit</button>
                                </template>
                                <template x-if="canManage">
                                    <button class="btn btn-ghost btn-xs text-error tap" @click="confirmDelete(cat)" :disabled="cat.deleted">Hapus</button>
                                </template>
                            </div>
                        </td>
                    </tr>
                </template>
                <tr x-show="filteredCategories.length === 0">
                    <td colspan="6" class="text-center py-8 text-base-content/50">Belum ada kategori</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div x-show="showModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center"
         x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
        <div class="absolute inset-0 bg-black/50" @click="showModal = false"></div>
        <div class="relative bg-base-100 rounded-xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden"
             x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100">

            <div class="px-6 py-4 border-b border-base-300">
                <h3 class="text-lg font-semibold" x-text="editMode ? 'Edit Kategori' : 'Tambah Kategori'"></h3>
            </div>

            <form @submit.prevent="saveCategory()">
                <div class="px-6 py-5 space-y-4">
                    <div class="form-control">
                        <label class="label"><span class="label-text">Code</span></label>
                        <input type="text" class="input input-bordered" x-model="form.code" required maxlength="50"
                               placeholder="e.g. PULSA" :disabled="saving">
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Nama</span></label>
                        <input type="text" class="input input-bordered" x-model="form.name" required maxlength="100"
                               placeholder="e.g. Pulsa & Telepon" :disabled="saving">
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Tipe Kategori</span></label>
                        <select class="select select-bordered" x-model="form.categoryType" required :disabled="saving">
                            <option value="">-- Pilih --</option>
                            <template x-for="type in categoryTypes" :key="type">
                                <option :value="type" x-text="type"></option>
                            </template>
                        </select>
                    </div>
                    <div class="form-control">
                        <label class="label"><span class="label-text">Icon URL</span></label>
                        <input type="text" class="input input-bordered" x-model="form.iconUrl" placeholder="https://..." :disabled="saving">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="form-control">
                            <label class="label"><span class="label-text">Sort Order</span></label>
                            <input type="number" class="input input-bordered" x-model.number="form.sortOrder" :disabled="saving">
                        </div>
                        <div class="form-control">
                            <label class="label"><span class="label-text">Status</span></label>
                            <label class="label cursor-pointer justify-start gap-3">
                                <input type="checkbox" class="toggle toggle-primary" x-model="form.active" :disabled="saving">
                                <span class="label-text" x-text="form.active ? 'Active' : 'Inactive'"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="px-6 py-4 bg-base-200/50 flex justify-end gap-3">
                    <button type="button" class="btn btn-ghost" @click="showModal = false" :disabled="saving">Batal</button>
                    <button type="submit" class="btn btn-primary" :disabled="saving">
                        <span x-show="saving" class="loading loading-spinner loading-sm"></span>
                        <span x-text="editMode ? 'Update' : 'Simpan'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Sync Preview Modal -->
    <div class="modal" :class="{ 'modal-open': showSyncModal }">
        <div class="modal-box max-w-2xl">
            <h3 class="font-bold text-lg" x-text="syncTitle">Preview Sync</h3>
            <template x-for="grp in ['ADD','UPDATE','DELETE']" :key="grp">
                <div x-show="syncGroup(grp).length" class="mt-4">
                    <div class="flex items-center justify-between">
                        <span class="font-semibold text-sm"
                              x-text="grp === 'ADD' ? '➕ Tambah' : grp === 'UPDATE' ? '✏️ Update harga' : '🗑️ Hapus'"></span>
                        <label class="label cursor-pointer gap-2 text-xs">
                            <span>pilih semua</span>
                            <input type="checkbox" class="checkbox checkbox-xs"
                                   :checked="syncGroup(grp).every(i => i.checked)"
                                   @change="toggleGroup(grp, $event.target.checked)">
                        </label>
                    </div>
                    <div class="max-h-48 overflow-y-auto mt-1">
                        <template x-for="it in syncGroup(grp)" :key="it.key">
                            <label class="flex items-center gap-2 py-1 text-sm cursor-pointer">
                                <input type="checkbox" class="checkbox checkbox-sm" x-model="it.checked">
                                <span x-text="it.label"></span>
                                <span class="text-xs text-base-content/50" x-show="it.detail" x-text="it.detail"></span>
                            </label>
                        </template>
                    </div>
                </div>
            </template>
            <div class="modal-action">
                <button class="btn btn-ghost" @click="showSyncModal = false" :disabled="syncing">Batal</button>
                <button class="btn btn-primary" @click="confirmSync('/api/admin/catalog/sync/categories', () => loadCategories())" :disabled="syncing">
                    <span x-show="syncing" class="loading loading-spinner loading-xs"></span> Terapkan
                </button>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script th:inline="javascript">
    const CATEGORY_TYPES = /*[[${categoryTypes}]]*/ [];
    const INITIAL_CATEGORIES = /*[[${initialCategories}]]*/ [];

    function categoryManager() {
        return {
            canManage: document.querySelector('[data-can-manage]')?.dataset.canManage === 'true',
            categories: INITIAL_CATEGORIES,
            categoryTypes: CATEGORY_TYPES,
            searchQuery: '',
            showModal: false,
            editMode: false,
            saving: false,
            editId: null,
            syncing: false,
            showSyncModal: false,
            syncItems: [],
            syncTitle: '',
            form: { code: '', name: '', categoryType: '', iconUrl: '', sortOrder: 0, active: true },

            get filteredCategories() {
                if (!this.searchQuery) return this.categories;
                const q = this.searchQuery.toLowerCase();
                return this.categories.filter(c =>
                    c.code.toLowerCase().includes(q) ||
                    c.name.toLowerCase().includes(q) ||
                    (c.categoryType && c.categoryType.toLowerCase().includes(q))
                );
            },

            async loadCategories() {
                try {
                    const res = await fetch('/api/admin/catalog/categories');
                    this.categories = await res.json();
                } catch (e) {
                    Alpine.store('toast').error('Gagal memuat kategori');
                }
            },

            async openSync(previewUrl, title) {
                this.syncing = true; this.syncTitle = title;
                try {
                    const res = await fetch(previewUrl);
                    if (!res.ok) throw new Error('gagal');
                    const raw = await res.json();
                    this.syncItems = raw.map(i => ({ ...i, checked: i.action !== 'DELETE' })); // DELETE default off
                    if (this.syncItems.length === 0) { Alpine.store('toast').success('Sudah sinkron dengan Digiflazz'); return; }
                    this.showSyncModal = true;
                } catch (e) { Alpine.store('toast').error('Gagal ambil preview'); }
                finally { this.syncing = false; }
            },
            syncGroup(action) { return this.syncItems.filter(i => i.action === action); },
            toggleGroup(action, val) { this.syncItems.forEach(i => { if (i.action === action) i.checked = val; }); },
            async confirmSync(applyUrl, reload) {
                const keys = this.syncItems.filter(i => i.checked).map(i => i.key);
                this.syncing = true;
                try {
                    const res = await fetch(applyUrl, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(keys) });
                    if (!res.ok) throw new Error('gagal');
                    const r = await res.json();
                    Alpine.store('toast').success(`Selesai: +${r.added} baru, ${r.updated} update, ${r.deleted} hapus, ${r.failed} gagal`);
                    this.showSyncModal = false;
                    await reload();
                } catch (e) { Alpine.store('toast').error('Gagal sync'); }
                finally { this.syncing = false; }
            },

            async syncAll() {
                const ok = await Alpine.store('confirm').open({
                    title: 'Sync dengan Supplier',
                    message: 'Sinkronkan kategori, produk, dan denom dengan supplier? Item baru ditambahkan & harga diperbarui. Yang hilang dari supplier hanya ditandai, tidak dihapus.',
                    confirmText: 'Sync', confirmClass: 'btn-primary'
                });
                if (!ok) return;
                this.syncing = true;
                try {
                    const res = await fetch('/api/admin/catalog/sync/all', { method: 'POST' });
                    if (!res.ok) throw new Error('gagal');
                    const r = await res.json();
                    Alpine.store('toast').success(`Sync selesai: +${r.added} baru, ${r.updated} update, ${r.failed} gagal`);
                    await this.loadCategories();
                } catch (e) { Alpine.store('toast').error('Gagal sync supplier'); }
                finally { this.syncing = false; }
            },

            openCreateModal() {
                this.editMode = false;
                this.editId = null;
                this.form = { code: '', name: '', categoryType: '', iconUrl: '', sortOrder: 0, active: true };
                this.showModal = true;
            },

            openEditModal(cat) {
                this.editMode = true;
                this.editId = cat.id;
                this.form = { code: cat.code, name: cat.name, categoryType: cat.categoryType,
                              iconUrl: cat.iconUrl || '', sortOrder: cat.sortOrder, active: cat.active };
                this.showModal = true;
            },

            async saveCategory() {
                this.saving = true;
                try {
                    const url = this.editMode
                        ? `/api/admin/catalog/categories/${this.editId}`
                        : '/api/admin/catalog/categories';
                    const method = this.editMode ? 'PUT' : 'POST';
                    const res = await fetch(url, {
                        method, headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(this.form)
                    });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        throw new Error(err.errorMessage || err.message || 'Gagal menyimpan');
                    }
                    this.showModal = false;
                    await this.loadCategories();
                    Alpine.store('toast').success(this.editMode ? 'Kategori diperbarui' : 'Kategori ditambahkan');
                } catch (e) {
                    Alpine.store('toast').error(e.message);
                } finally {
                    this.saving = false;
                }
            },

            async confirmDelete(cat) {
                const ok = await Alpine.store('confirm').open({
                    title: 'Hapus Kategori',
                    message: `Yakin hapus kategori "${cat.name}"? Kategori yang masih punya produk aktif tidak bisa dihapus — pindahkan produknya dulu.`,
                    confirmText: 'Hapus',
                    confirmClass: 'btn-error'
                });
                if (!ok) return;
                try {
                    const res = await fetch(`/api/admin/catalog/categories/${cat.id}`, { method: 'DELETE' });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        throw new Error(err.message || err.errorMessage || 'Gagal menghapus');
                    }
                    await this.loadCategories();
                    Alpine.store('toast').success('Kategori dihapus');
                } catch (e) {
                    Alpine.store('toast').error(e.message);
                }
            }
        };
    }
</script>
</th:block>
</body>
</html>
