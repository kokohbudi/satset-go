<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- ============================================== -->
    <!-- FORM INPUT COMPONENTS                          -->
    <!-- ============================================== -->

    <!-- Text Input -->
    <!-- Usage: <div th:replace="~{components/forms :: text-input(name='username', label='Username', placeholder='Masukkan username', required=true)}"></div> -->
    <div th:fragment="text-input(name, label, placeholder, required, value, error)" class="form-control w-full">
        <label class="label">
            <span class="label-text font-medium" th:text="${label}">Label</span>
            <span th:if="${required}" class="label-text-alt text-error">*</span>
        </label>
        <input type="text" th:name="${name}" th:id="${name}" th:placeholder="${placeholder}" th:value="${value}"
            th:required="${required}" class="input input-bordered w-full focus:input-primary transition-colors"
            th:classappend="${error} ? 'input-error' : ''" />
        <label th:if="${error}" class="label">
            <span class="label-text-alt text-error" th:text="${error}">Error message</span>
        </label>
    </div>

    <!-- Email Input -->
    <div th:fragment="email-input(name, label, placeholder, required, value, error)" class="form-control w-full">
        <label class="label">
            <span class="label-text font-medium" th:text="${label}">Email</span>
            <span th:if="${required}" class="label-text-alt text-error">*</span>
        </label>
        <label class="input input-bordered flex items-center gap-2 focus-within:input-primary transition-colors"
            th:classappend="${error} ? 'input-error' : ''">
            <svg class="w-4 h-4 text-base-content/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            <input type="email" th:name="${name}" th:id="${name}" th:placeholder="${placeholder ?: 'email@contoh.com'}"
                th:value="${value}" th:required="${required}" class="grow bg-transparent outline-none" />
        </label>
        <label th:if="${error}" class="label">
            <span class="label-text-alt text-error" th:text="${error}">Error message</span>
        </label>
    </div>

    <!-- Password Input -->
    <div th:fragment="password-input(name, label, placeholder, required, error)" class="form-control w-full"
        x-data="{ showPassword: false }">
        <label class="label">
            <span class="label-text font-medium" th:text="${label}">Password</span>
            <span th:if="${required}" class="label-text-alt text-error">*</span>
        </label>
        <label class="input input-bordered flex items-center gap-2 focus-within:input-primary transition-colors"
            th:classappend="${error} ? 'input-error' : ''">
            <svg class="w-4 h-4 text-base-content/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
            <input :type="showPassword ? 'text' : 'password'" th:name="${name}" th:id="${name}"
                th:placeholder="${placeholder ?: '••••••••'}" th:required="${required}"
                class="grow bg-transparent outline-none" />
            <button type="button" @click="showPassword = !showPassword" class="btn btn-ghost btn-xs btn-circle">
                <svg x-show="!showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
                <svg x-show="showPassword" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                </svg>
            </button>
        </label>
        <label th:if="${error}" class="label">
            <span class="label-text-alt text-error" th:text="${error}">Error message</span>
        </label>
    </div>

    <!-- Phone Input -->
    <div th:fragment="phone-input(name, label, placeholder, required, value, error)" class="form-control w-full">
        <label class="label">
            <span class="label-text font-medium" th:text="${label}">No. Telepon</span>
            <span th:if="${required}" class="label-text-alt text-error">*</span>
        </label>
        <label class="input input-bordered flex items-center gap-2 focus-within:input-primary transition-colors"
            th:classappend="${error} ? 'input-error' : ''">
            <span class="text-base-content/70 text-sm border-r border-base-300 pr-2">+62</span>
            <input type="tel" th:name="${name}" th:id="${name}" th:placeholder="${placeholder ?: '812xxxx'}"
                th:value="${value}" th:required="${required}" pattern="[0-9]*"
                class="grow bg-transparent outline-none" />
        </label>
        <label th:if="${error}" class="label">
            <span class="label-text-alt text-error" th:text="${error}">Error message</span>
        </label>
    </div>

    <!-- Select Input -->
    <div th:fragment="select-input(name, label, required, error)" class="form-control w-full">
        <label class="label">
            <span class="label-text font-medium" th:text="${label}">Select</span>
            <span th:if="${required}" class="label-text-alt text-error">*</span>
        </label>
        <select th:name="${name}" th:id="${name}" th:required="${required}"
            class="select select-bordered w-full focus:select-primary transition-colors"
            th:classappend="${error} ? 'select-error' : ''">
            <option disabled selected>Pilih opsi...</option>
            <!-- Options will be injected -->
            <th:block th:replace="${options}"></th:block>
        </select>
        <label th:if="${error}" class="label">
            <span class="label-text-alt text-error" th:text="${error}">Error message</span>
        </label>
    </div>

    <!-- Textarea -->
    <div th:fragment="textarea-input(name, label, placeholder, required, value, rows, error)"
        class="form-control w-full">
        <label class="label">
            <span class="label-text font-medium" th:text="${label}">Description</span>
            <span th:if="${required}" class="label-text-alt text-error">*</span>
        </label>
        <textarea th:name="${name}" th:id="${name}" th:placeholder="${placeholder}" th:required="${required}"
            th:rows="${rows ?: 3}" th:text="${value}"
            class="textarea textarea-bordered w-full focus:textarea-primary transition-colors resize-none"
            th:classappend="${error} ? 'textarea-error' : ''"></textarea>
        <label th:if="${error}" class="label">
            <span class="label-text-alt text-error" th:text="${error}">Error message</span>
        </label>
    </div>

    <!-- Checkbox -->
    <div th:fragment="checkbox-input(name, label, checked)" class="form-control">
        <label class="label cursor-pointer justify-start gap-3">
            <input type="checkbox" th:name="${name}" th:id="${name}" th:checked="${checked}"
                class="checkbox checkbox-primary" />
            <span class="label-text" th:text="${label}">Checkbox label</span>
        </label>
    </div>

    <!-- Toggle Switch -->
    <div th:fragment="toggle-input(name, label, checked, description)" class="form-control">
        <label class="label cursor-pointer justify-between">
            <div>
                <span class="label-text font-medium" th:text="${label}">Toggle label</span>
                <p th:if="${description}" th:text="${description}" class="text-xs text-base-content/60 mt-0.5">
                    Description</p>
            </div>
            <input type="checkbox" th:name="${name}" th:id="${name}" th:checked="${checked}"
                class="toggle toggle-primary" />
        </label>
    </div>

    <!-- Radio Group -->
    <div th:fragment="radio-group(name, label, required)" class="form-control w-full">
        <label class="label">
            <span class="label-text font-medium" th:text="${label}">Radio Group</span>
            <span th:if="${required}" class="label-text-alt text-error">*</span>
        </label>
        <div class="space-y-2">
            <!-- Radio options will be injected -->
            <th:block th:replace="${radioOptions}"></th:block>
        </div>
    </div>

    <!-- Radio Option -->
    <label th:fragment="radio-option(name, value, label, checked)"
        class="label cursor-pointer justify-start gap-3 p-3 rounded-lg border border-base-300 hover:border-primary/50 transition-colors"
        th:classappend="${checked} ? 'border-primary bg-primary/5' : ''">
        <input type="radio" th:name="${name}" th:value="${value}" th:checked="${checked}" class="radio radio-primary" />
        <span class="label-text" th:text="${label}">Option</span>
    </label>

    <!-- File Upload -->
    <div th:fragment="file-input(name, label, accept, required)" class="form-control w-full">
        <label class="label">
            <span class="label-text font-medium" th:text="${label}">Upload File</span>
            <span th:if="${required}" class="label-text-alt text-error">*</span>
        </label>
        <input type="file" th:name="${name}" th:id="${name}" th:accept="${accept}" th:required="${required}"
            class="file-input file-input-bordered file-input-primary w-full" />
    </div>

    <!-- Search Input with Icon -->
    <div th:fragment="search-input(name, placeholder)" class="form-control w-full">
        <label class="input input-bordered flex items-center gap-2 focus-within:input-primary transition-colors">
            <svg class="w-4 h-4 text-base-content/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input type="search" th:name="${name}" th:id="${name}" th:placeholder="${placeholder ?: 'Cari...'}"
                class="grow bg-transparent outline-none" />
        </label>
    </div>

    <!-- Currency Input (Indonesian Rupiah) -->
    <div th:fragment="currency-input(name, label, placeholder, required, value, error)" class="form-control w-full">
        <label class="label">
            <span class="label-text font-medium" th:text="${label}">Nominal</span>
            <span th:if="${required}" class="label-text-alt text-error">*</span>
        </label>
        <label class="input input-bordered flex items-center gap-2 focus-within:input-primary transition-colors"
            th:classappend="${error} ? 'input-error' : ''">
            <span class="text-base-content/70 text-sm font-medium">Rp</span>
            <input type="text" th:name="${name}" th:id="${name}" th:placeholder="${placeholder ?: '0'}"
                th:value="${value}" th:required="${required}" class="grow bg-transparent outline-none"
                oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.')" />
        </label>
        <label th:if="${error}" class="label">
            <span class="label-text-alt text-error" th:text="${error}">Error message</span>
        </label>
    </div>

</body>

</html>
