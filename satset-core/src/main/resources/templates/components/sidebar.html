<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:x-transition="http://www.w3.org/1999/xhtml">

<!--
    SIDEBAR LINKS = KEYCLOAK-DRIVEN. JANGAN HARDCODE MENU DI SINI.
    Semua menu (kecuali Dashboard & Logout) dirender dari Keycloak role attributes:
      - sidebar=1, url=/path, display_name=Label
    Jika ada task "tambah sidebar link", SKIP — cukup set role attributes di Keycloak.
-->
<body>

    <!-- Backdrop Overlay -->
    <div x-cloak x-show="sidebarOpen" x-transition:enter="transition ease-in-out duration-300"
        x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in-out duration-300" x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0" @click="sidebarOpen = false"
        class="fixed inset-0 bg-black/50 z-40 lg:hidden"></div>

    <!-- Sidebar Fragment - Include with: th:replace="~{components/sidebar :: sidebar}" -->
    <aside th:fragment="sidebar" id="app-sidebar" :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
        class="fixed left-0 top-0 h-screen w-72 bg-base-100 border-r border-base-300 shadow-xl z-50 transform transition-transform duration-300 ease-in-out hidden lg:block">

        <!-- Logo Section (left padding leaves room for the fixed sidebar toggle) -->
        <div class="h-16 flex items-center justify-between pl-16 pr-4 border-b border-base-300">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-brand-orange-600 flex items-center justify-center shadow-lg shadow-brand-orange-600/30">
                    <svg th:replace="~{components/icons :: icon-bolt(class='w-6 h-6 text-white')}"></svg>
                </div>
                <span class="font-bold text-xl tracking-tight">satset<span class="text-primary">go</span></span>
            </div>

            <!-- Close Button (Mobile Only) -->
            <button @click="sidebarOpen = false" class="btn btn-ghost btn-circle btn-sm lg:hidden"
                aria-label="Tutup sidebar">
                <svg th:replace="~{components/icons :: icon-close(class='w-6 h-6')}"></svg>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="p-4 space-y-2 overflow-y-auto h-[calc(100vh-8rem)]">
            <!-- Dashboard -->
            <a th:href="@{/dashboard}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all"
                th:classappend="${currentPage == 'dashboard'} ? 'bg-primary text-primary-content shadow-lg' : 'hover:bg-primary/10 hover:text-primary'">
                <svg th:replace="~{components/icons :: icon-home(class='w-5 h-5')}"></svg>
                Dashboard
            </a>


            <!-- Section: Menu dari Role Attributes -->
            <div class="pt-4" th:if="${userRoles != null and !userRoles.isEmpty()}">

                <th:block th:each="role : ${userRoles}">
                    <!-- CASE 1: Role dengan children -->
                    <th:block
                        th:if="${role.children != null and !role.children.isEmpty()}">
                        <!-- Section Header: hanya muncul kalau parent punya sidebar=1 -->
                        <span
                            th:if="${role.attributes != null and role.attributes['sidebar'] == '1'}"
                            class="px-4 text-xs font-semibold uppercase tracking-wider text-base-content/50 block pt-4"
                            th:text="${role.attributes['display_name'] != null} ? ${role.attributes['display_name']} : ${role.name}">Section</span>

                        <!-- Children: muncul berdasarkan sidebar flag masing-masing -->
                        <th:block th:each="child : ${role.children}">
                            <div class="relative group"
                                th:if="${child.attributes != null and child.attributes['sidebar'] == '1' and child.attributes['url'] != null and !child.attributes['url'].isEmpty()}">
                                <a th:href="${child.attributes['url']}"
                                    th:with="iconName=${child.attributes['icon'] != null and !child.attributes['icon'].isEmpty() ? child.attributes['icon'] : 'icon-document'}"
                                    class="flex items-center gap-3 px-4 py-3 pr-10 rounded-xl transition-all"
                                    th:classappend="${currentPath != null and currentPath.startsWith(child.attributes['url'])} ? 'bg-primary text-primary-content shadow-lg' : 'hover:bg-primary/10 hover:text-primary'">
                                    <svg th:replace="~{components/icons :: __${iconName}__(class='w-5 h-5')}"></svg>
                                    <span
                                        th:text="${child.attributes['display_name'] != null and !child.attributes['display_name'].isEmpty()} ? ${child.attributes['display_name']} : ${child.name}">Menu
                                        Item</span>
                                </a>
                                <button type="button" th:data-role="${child.name}" onclick="toggleQuickMenu(this)"
                                    title="Pin ke menu cepat"
                                    class="absolute right-2 top-1/2 -translate-y-1/2 p-1 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity"
                                    th:classappend="${pinnedRoleNames != null and pinnedRoleNames.contains(child.name)} ? 'text-primary' : 'text-base-content/30'">
                                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                                        <path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.42 4.36a1 1 0 00.95.69h4.59c.97 0 1.37 1.24.59 1.81l-3.71 2.7a1 1 0 00-.36 1.12l1.41 4.36c.3.92-.75 1.69-1.54 1.12l-3.71-2.7a1 1 0 00-1.18 0l-3.71 2.7c-.79.57-1.84-.2-1.54-1.12l1.41-4.36a1 1 0 00-.36-1.12l-3.71-2.7c-.78-.57-.38-1.81.59-1.81h4.59a1 1 0 00.95-.69l1.42-4.36z"/>
                                    </svg>
                                </button>
                            </div>
                        </th:block>
                    </th:block>

                    <!-- CASE 2: Role tanpa children tapi punya sidebar=1 dan url (sebagai standalone menu item) -->
                    <div class="relative group"
                        th:if="${role.attributes != null and role.attributes['sidebar'] == '1' and role.attributes['url'] != null and !role.attributes['url'].isEmpty() and (role.children == null or role.children.isEmpty())}">
                        <a th:href="${role.attributes['url']}"
                            th:with="iconName=${role.attributes['icon'] != null and !role.attributes['icon'].isEmpty() ? role.attributes['icon'] : 'icon-document'}"
                            class="flex items-center gap-3 px-4 py-3 pr-10 rounded-xl transition-all"
                            th:classappend="${currentPath != null and currentPath.startsWith(role.attributes['url'])} ? 'bg-primary text-primary-content shadow-lg' : 'hover:bg-primary/10 hover:text-primary'">
                            <svg th:replace="~{components/icons :: __${iconName}__(class='w-5 h-5')}"></svg>
                            <span
                                th:text="${role.attributes['display_name'] != null and !role.attributes['display_name'].isEmpty()} ? ${role.attributes['display_name']} : ${role.name}">Menu
                                Item</span>
                        </a>
                        <button type="button" th:data-role="${role.name}" onclick="toggleQuickMenu(this)"
                            title="Pin ke menu cepat"
                            class="absolute right-2 top-1/2 -translate-y-1/2 p-1 rounded-lg opacity-0 group-hover:opacity-100 transition-opacity"
                            th:classappend="${pinnedRoleNames != null and pinnedRoleNames.contains(role.name)} ? 'text-primary' : 'text-base-content/30'">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
                                <path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.42 4.36a1 1 0 00.95.69h4.59c.97 0 1.37 1.24.59 1.81l-3.71 2.7a1 1 0 00-.36 1.12l1.41 4.36c.3.92-.75 1.69-1.54 1.12l-3.71-2.7a1 1 0 00-1.18 0l-3.71 2.7c-.79.57-1.84-.2-1.54-1.12l1.41-4.36a1 1 0 00-.36-1.12l-3.71-2.7c-.78-.57-.38-1.81.59-1.81h4.59a1 1 0 00.95-.69l1.42-4.36z"/>
                            </svg>
                        </button>
                    </div>
                </th:block>
            </div>

        </nav>

        <!-- Bottom Section - Logout -->
        <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-base-300 bg-base-100">
            <a th:href="@{/logout}"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-error hover:bg-error/10 transition-all">
                <svg th:replace="~{components/icons :: icon-logout(class='w-5 h-5')}"></svg>
                Keluar
            </a>
        </div>
        <script>
            function toggleQuickMenu(btn) {
                const roleName = btn.dataset.role;
                fetch('/quick-menu/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ roleName })
                })
                    .then(r => r.ok ? r.json() : null)
                    .then(d => {
                        if (!d) return;
                        btn.classList.toggle('text-primary', d.pinned);
                        btn.classList.toggle('text-base-content/30', !d.pinned);
                    })
                    .catch(() => {});
            }
        </script>
    </aside>

</body>

</html>
