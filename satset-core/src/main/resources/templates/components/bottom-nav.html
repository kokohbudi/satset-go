<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <!-- Bottom Navigation Fragment -->
    <nav th:fragment="bottom-nav"
        class="fixed bottom-0 left-0 right-0 z-40 bg-base-100 border-t border-base-300 lg:hidden pb-safe">
        <!-- Horizontal Scroll Container -->
        <div class="flex items-center h-16 overflow-x-auto px-4 gap-2 no-scrollbar"
            style="-ms-overflow-style: none; scrollbar-width: none;">
            <style>
                .no-scrollbar::-webkit-scrollbar {
                    display: none;
                }
            </style>

            <!-- Dashboard -->
            <a th:href="@{/dashboard}"
                class="flex-none w-20 flex flex-col items-center justify-center h-full text-xs gap-1 rounded-xl transition-colors snap-center"
                th:classappend="${currentPage == 'dashboard'} ? 'text-primary bg-primary/5' : 'text-base-content/60 hover:text-base-content'">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span>Home</span>
            </a>

            <!-- Users -->
            <a th:href="@{/users}"
                class="flex-none w-20 flex flex-col items-center justify-center h-full text-xs gap-1 rounded-xl transition-colors snap-center"
                th:classappend="${currentPage == 'users'} ? 'text-primary bg-primary/5' : 'text-base-content/60 hover:text-base-content'">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197" />
                </svg>
                <span>Users</span>
            </a>

            <!-- Groups -->
            <a th:href="@{/groups}"
                class="flex-none w-20 flex flex-col items-center justify-center h-full text-xs gap-1 rounded-xl transition-colors snap-center"
                th:classappend="${currentPage == 'groups'} ? 'text-primary bg-primary/5' : 'text-base-content/60 hover:text-base-content'">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span>Groups</span>
            </a>

            <!-- Assign User -->
            <a th:href="@{/user-groups}"
                class="flex-none w-20 flex flex-col items-center justify-center h-full text-xs gap-1 rounded-xl transition-colors snap-center"
                th:classappend="${currentPage == 'user-groups'} ? 'text-primary bg-primary/5' : 'text-base-content/60 hover:text-base-content'">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                </svg>
                <span>Assign</span>
            </a>

            <!-- Separator -->
            <div class="flex-none w-[1px] h-8 bg-base-300 mx-1"></div>

            <!-- Transactions -->
            <a th:href="@{/transactions}"
                class="flex-none w-20 flex flex-col items-center justify-center h-full text-xs gap-1 rounded-xl transition-colors snap-center"
                th:classappend="${currentPage == 'transactions'} ? 'text-primary bg-primary/5' : 'text-base-content/60 hover:text-base-content'">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                <span>History</span>
            </a>

            <!-- Deposit -->
            <a th:href="@{/deposit}"
                class="flex-none w-20 flex flex-col items-center justify-center h-full text-xs gap-1 rounded-xl transition-colors snap-center"
                th:classappend="${currentPage == 'deposit'} ? 'text-primary bg-primary/5' : 'text-base-content/60 hover:text-base-content'">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>Deposit</span>
            </a>

            <!-- Dynamic Roles Loop -->
            <th:block th:if="${userRoles != null and !userRoles.isEmpty()}">
                <th:block th:each="role : ${userRoles}">
                    <!-- Children items flattened for bottom nav -->
                    <th:block th:if="${role.children != null}">
                        <th:block th:each="child : ${role.children}">
                            <a th:if="${child.attributes != null and child.attributes['sidebar'] == '1' and child.attributes['url'] != null and !child.attributes['url'].isEmpty()}"
                                th:href="${child.attributes['url']}"
                                class="flex-none w-20 flex flex-col items-center justify-center h-full text-xs gap-1 rounded-xl transition-colors snap-center text-base-content/60 hover:text-base-content">
                                <svg class="w-6 h-6 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 6h16M4 12h16M4 18h16" />
                                </svg>
                                <span
                                    th:text="${child.attributes['display_name'] != null and !child.attributes['display_name'].isEmpty()} ? ${child.attributes['display_name']} : ${child.name}">Item</span>
                            </a>
                        </th:block>
                    </th:block>

                    <!-- Standalone items -->
                    <a th:if="${role.attributes != null and role.attributes['sidebar'] == '1' and role.attributes['url'] != null and !role.attributes['url'].isEmpty() and (role.children == null or role.children.isEmpty())}"
                        th:href="${role.attributes['url']}"
                        class="flex-none w-20 flex flex-col items-center justify-center h-full text-xs gap-1 rounded-xl transition-colors snap-center text-base-content/60 hover:text-base-content">
                        <svg class="w-6 h-6 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                        <span
                            th:text="${role.attributes['display_name'] != null and !role.attributes['display_name'].isEmpty()} ? ${role.attributes['display_name']} : ${role.name}">Item</span>
                    </a>
                </th:block>
            </th:block>

            <!-- Separator -->
            <div class="flex-none w-[1px] h-8 bg-base-300 mx-1"></div>

            <!-- Settings (Admin) -->
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/settings}"
                class="flex-none w-20 flex flex-col items-center justify-center h-full text-xs gap-1 rounded-xl transition-colors snap-center"
                th:classappend="${currentPage == 'settings'} ? 'text-primary bg-primary/5' : 'text-base-content/60 hover:text-base-content'">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span>Settings</span>
            </a>

            <!-- Logout -->
            <a th:href="@{/logout}"
                class="flex-none w-20 flex flex-col items-center justify-center h-full text-xs gap-1 rounded-xl transition-colors snap-center text-error/80 hover:text-error hover:bg-error/5">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                <span>Keluar</span>
            </a>

            <!-- Spacer for right padding -->
            <div class="flex-none w-2"></div>
        </div>
    </nav>

</body>

</html>
